.capture-status-wrap {
	position: relative;
	flex: 0 0 auto;
}
.capture-status {
	--capture-ink: var(--color-text-secondary);
	--capture-wash: var(--color-sidebar);
	display: flex;
	align-items: center;
	gap: var(--space-7);
}
.capture-status.recording {
	--capture-ink: var(--color-brand);
	--capture-wash: var(--color-positive-soft);
}
.capture-status.warning {
	--capture-ink: var(--color-warning-strong);
	--capture-wash: var(--color-warning-soft);
}
.capture-status-rabbit {
	position: relative;
	display: block;
	width: 96px;
	height: 96px;
	flex: 0 0 96px;
	padding: 0;
	border: 0;
	border-radius: var(--radius-xl);
	background: transparent;
}
.capture-status-rabbit:disabled {
	opacity: 1;
}
.capture-status-rabbit:before {
	content: "";
	position: absolute;
	left: 14px;
	right: 14px;
	bottom: 6px;
	height: 8px;
	border-radius: 50%;
	background: var(--capture-wash);
}
.capture-status-rabbit .rabbit-art,
.capture-status-rabbit .rabbit-pixels,
.capture-status-rabbit .rabbit-fallback,
.capture-status-rabbit .rabbit-fallback img,
.capture-resting-rabbit {
	position: relative;
	display: block;
	width: 100%;
	height: 100%;
	object-fit: contain;
	image-rendering: pixelated;
}
.capture-status-rabbit .rabbit-warning {
	position: absolute;
	right: 4px;
	top: 4px;
	width: 18px;
	height: 18px;
	border-radius: 50%;
	background: var(--color-warning-soft);
	color: var(--color-warning-strong);
	font-size: var(--type-meta);
	text-align: center;
}
.capture-status-copy {
	display: grid;
	justify-items: start;
	gap: var(--space-2);
	min-width: 122px;
}
.capture-status-copy strong {
	font-size: var(--type-lead);
	font-weight: var(--weight-semibold);
	color: var(--capture-ink);
	line-height: var(--leading-tight);
}
.capture-status-copy > span {
	color: var(--color-text-muted);
	font-size: var(--type-caption);
	line-height: var(--leading-body);
}
.capture-rabbit-overlay {
	position: absolute;
	inset: 0;
	display: flex;
	align-items: center;
	justify-content: center;
	border-radius: inherit;
	background: var(--entry-control-overlay);
	color: var(--entry-control-ink);
	font-size: var(--type-meta);
	font-weight: var(--weight-semibold);
	opacity: 0;
	transition: opacity 120ms;
}
.capture-status-rabbit:hover .capture-rabbit-overlay,
.capture-status-rabbit:focus-visible .capture-rabbit-overlay,
.capture-rabbit-overlay[data-persistent="true"] {
	opacity: 1;
}
.capture-rabbit-overlay svg {
	width: 28px;
	height: 28px;
}
.capture-status-feedback {
	position: absolute;
	right: 0;
	top: calc(100% + var(--space-4));
	z-index: var(--layer-floating-menu);
	width: 300px;
	padding: var(--space-6) var(--space-7);
	border: 1px solid var(--color-warning-border);
	border-radius: var(--radius-md);
	background: var(--color-warning-surface);
	color: var(--color-warning-strong);
	font-size: var(--type-meta);
	line-height: var(--leading-body);
	box-shadow: var(--shadow-popover);
	overflow-wrap: anywhere;
}
.capture-resting-body {
	animation: rabbit-rest-breathe var(--motion-rabbit-rest) steps(1, end)
		infinite;
}
@keyframes rabbit-rest-breathe {
	0%,
	100% {
		transform: translateY(0);
	}
	50% {
		transform: translateY(-1px);
	}
}
.capture-status[data-animate="false"] .capture-resting-body {
	animation: none;
}
@media (prefers-reduced-motion: reduce) {
	.capture-resting-body {
		animation: none;
	}
	.capture-rabbit-overlay {
		transition: none;
	}
}

const states=[
{id:'listening',label:'正在记录',subtitle:'麦克风 · 电脑声音',tone:'recording',tag:'呼吸 + 眨眼',desc:'双耳竖起，缓慢呼吸，偶尔眨眼。',action:'暂停'},
{id:'sleeping',label:'已暂停',subtitle:'声音记录已暂停',tone:'paused',tag:'趴睡呼吸',desc:'新趴睡姿态，背部每4.8秒起伏，脸和前爪静止。',action:'继续'},
{id:'waiting',label:'正在连接',subtitle:'等待声音来源就绪',tone:'waiting',tag:'静态等待',desc:'保持清醒等待；连接与启停时显示相应文案。',action:'请稍候'},
{id:'partial',label:'部分记录',subtitle:'麦克风仍在记录',tone:'warning',tag:'静态提示',desc:'一部分声音来源不可用，仍在记录的来源写在旁边。',action:'暂停'},
{id:'interrupted',label:'记录中断',subtitle:'检查权限或声音设备',tone:'warning',tag:'静态 + 异常标记',desc:'等待姿态加「!」标记，提示检查设备或权限。',action:'设置'}
];
let selected='listening'; const image=new Image(); image.src=atlas; const players=new Set(); const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const icon=pause=>`<svg viewBox="0 0 20 20" fill="none" aria-hidden="true">${pause?'<path d="M7 5v10M13 5v10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>':'<path d="m7 4 9 6-9 6Z" fill="currentColor"/>'}</svg>`;
function module(s,hero=false){return `<section class="capture-status ${s.tone}" aria-label="声音记录状态"><button type="button" class="capture-status-rabbit" ${s.id==='waiting'?'disabled':''} aria-label="${hero?s.action+(['listening','sleeping','partial'].includes(s.id)?'记录':''):'查看'+s.label}">${false?'':`<span class="rabbit-art"><canvas class="rabbit-pixels" data-state="${s.id}"></canvas>${s.id==='interrupted'?'<span class="rabbit-warning">!</span>':''}</span>`}${hero?`<span class="capture-rabbit-overlay" aria-hidden="true">${['listening','partial','sleeping'].includes(s.id)?icon(s.id!=='sleeping'):s.action}</span>`:''}</button><div class="capture-status-copy"><strong>${s.label}</strong><span>${s.subtitle}</span></div></section>`}
function draw(canvas,frame){const f=manifest.frames[frame],size=canvas.getBoundingClientRect().width,dpr=devicePixelRatio||1;const px=Math.round(size*dpr);if(canvas.width!==px){canvas.width=px;canvas.height=px}const c=canvas.getContext('2d');c.imageSmoothingEnabled=false;c.clearRect(0,0,px,px);c.drawImage(image,f.x,f.y,f.width,f.height,0,0,px,px)}
function start(canvas){const clip=manifest.clips[canvas.dataset.state];let timer;let index=0;const p={stop:()=>clearTimeout(timer),restart:()=>{clearTimeout(timer);index=0;tick()}};function tick(){if(!canvas.isConnected){players.delete(p);return}const [frame,delay]=clip.frames[index];draw(canvas,frame);if(document.hidden||reduced.matches)return;if(index+1<clip.frames.length){index++;timer=setTimeout(tick,delay)}else if(clip.loop){index=0;timer=setTimeout(tick,delay)}}players.add(p);tick()}
function mount(scope){if(image.complete&&image.naturalWidth)scope.querySelectorAll('canvas').forEach(start);else image.addEventListener('load',()=>scope.querySelectorAll('canvas').forEach(start),{once:true})}
function choose(id){selected=id;const s=states.find(s=>s.id===id);document.getElementById('hero').innerHTML=module(s,true);mount(document.getElementById('hero'));document.querySelectorAll('.state-card').forEach(c=>c.classList.toggle('selected',c.dataset.state===id));document.querySelectorAll('.select-state').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===id)));document.getElementById('notice').textContent='当前展示：'+s.label+'。'+(id==='interrupted'?'检查设备或权限后恢复记录。':id==='waiting'?'等待来源就绪，暂不可切换。':'鼠标移到兔子上查看开关。');document.querySelector('#hero button').addEventListener('click',()=>{if(id==='interrupted'){document.getElementById('notice').textContent='演示：此处会打开设置，检查声音设备与权限。';return}choose(id==='sleeping'?'listening':'sleeping')})}
document.getElementById('grid').innerHTML=states.map((s,i)=>`<article class="state-card" data-state="${s.id}"><div class="card-top"><span class="card-number">0${i+1}</span><span class="chip">${s.tag}</span></div>${module(s)}<p>${s.desc}</p><button class="select-state" data-state="${s.id}" aria-pressed="false">在首页预览 ↗</button></article>`).join('');document.querySelectorAll('.select-state').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.state)));mount(document.getElementById('grid'));choose(selected);
document.getElementById('size').addEventListener('click',e=>{const large=document.body.classList.toggle('enlarged');e.currentTarget.setAttribute('aria-pressed',String(large));e.currentTarget.textContent=large?'实际尺寸':'放大查看';players.forEach(p=>p.restart())});
function visibility(){document.querySelectorAll('.capture-status').forEach(s=>s.dataset.animate=String(!document.hidden));players.forEach(p=>document.hidden?p.stop():p.restart())}document.addEventListener('visibilitychange',visibility);reduced.addEventListener('change',()=>players.forEach(p=>p.restart()));
</script></body></html>
