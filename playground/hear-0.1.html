    const START=0, NOW=978, DAY_END=1440, TODAY='2026-09-27';
    const seed={
      view:'timeline',selected:'event:meeting',tab:'transcript',playhead:null,noteDraft:'',query:'',personFilter:'all',recording:true,pauseReason:'',mic:true,system:true,storageAlert:false,queues:{llm:true,asr:true},

        {id:'s11',at:954,end:955,source:'mic',text:'待会儿整理一下客户反馈。',audio:true,rough:true}
      ],

          {id:'p26s6',at:895,end:897,source:'mic',text:'这部分可以直接按时间找回。',audio:true,rough:false,speaker:'demo26:1'}
        ],
        actions:[{id:'p26a1',at:607,type:'screenshot',note:'第二版布局',ocr:'时间线 设计'}],
        manualAsr:[]
      }],
      ['2026-09-25',{
        events:[{id:'interview25',start:780,end:855,title:'用户访谈',source:'both',asr:'done',origin:'自动拟合'}],
        segments:[
          {id:'p25s1',at:601,end:603,source:'mic',text:'访谈提纲再过一遍。',audio:true,rough:true},
          {id:'p25s2',at:797,end:801,source:'system',text:'我通常会先记下手头最重要的事。',audio:true,rough:false,speaker:'interview25:1'},
          {id:'p25s3',at:831,end:834,source:'mic',text:'回看时希望能看到当时的上下文。',audio:true,rough:false,speaker:'interview25:2'}
        ],
        actions:[{id:'p25a1',at:808,type:'mark'}],manualAsr:[]
      }]
    ]);
    let modal=null,toastTimer=null;
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    const dayLimit=()=>state.date===TODAY?NOW:DAY_END;
    const dateTitle=d=>{const [year,month,day]=d.split('-').map(Number);return `${month}月${day}日`};
    const weekday=d=>['周日','周一','周二','周三','周四','周五','周六'][new Date(`${d}T12:00:00Z`).getUTCDay()];
    const shiftDate=(d,n)=>{const x=new Date(`${d}T12:00:00Z`);x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
    const allSegments=()=>[...new Map([...dayStore.entries()].filter(([date])=>date!==state.date).flatMap(([,data])=>data.segments).concat(state.segments).map(s=>[s.id,s])).values()];
    const activeActions=()=>state.date===TODAY?state.actions:dayStore.get(TODAY).actions;
    const dayEntries=()=>[...new Map([...dayStore.entries(),[state.date,{events:state.events,segments:state.segments,actions:state.actions,manualAsr:state.manualAsr}]])];
    const allEvents=()=>dayEntries().flatMap(([date,data])=>data.events.map(event=>({...event,date})));
    const allJobs=()=>dayEntries().flatMap(([date,data])=>data.manualAsr.map(job=>({...job,date})));
    const parseTime=s=>{const a=/^(\d{1,2}):(\d{2})$/.exec(String(s).trim());return a?Number(a[1])*60+Number(a[2]):NaN};
    const sourceName=s=>s==='mic'?'麦克风':s==='system'?'电脑声音':'双路声音';
    const sourceSet=s=>s==='both'?['mic','system']:[s];
    const intersects=(a,b)=>sourceSet(a).some(s=>sourceSet(b).includes(s));
    const between=(n,start,end)=>n>=start&&n<end;
    const peopleName=id=>state.people.find(p=>p.id===id)?.name||'未知人物';
    const speakerMatch=s=>state.segmentAssignments[s.id]||state.assignments[s.speaker];
    const blockSegments=b=>state.segments.filter(s=>between(s.at,b.start,b.end)&&sourceSet(b.source||'both').includes(s.source));
    const blockActions=b=>state.actions.filter(a=>between(a.at,b.start,b.end));
    function blocks(){
      const ev=[...state.events].sort((a,b)=>a.start-b.start||a.end-b.end),out=[];let cursor=START;
      const addGap=(start,end,first=false,last=false)=>{
        const times=[...state.segments.map(s=>s.at),...state.actions.map(a=>a.at)].filter(t=>between(t,start,end));
        if(!times.length)return;
        if(first)start=Math.max(start,Math.floor(Math.min(...times)/60)*60);
        if(last&&state.date!==TODAY)end=Math.min(end,Math.ceil((Math.max(...times)+1)/60)*60);
        out.push({id:`gap:${start}-${end}`,start,end,title:'未整理',source:'both',kind:'gap'});
      };
      for(const e of ev){
        if(e.start>cursor)addGap(cursor,e.start,cursor===START,false);
        out.push({...e,id:`event:${e.id}`,kind:'event'});cursor=Math.max(cursor,e.end)
      }
      if(cursor<dayLimit())addGap(cursor,dayLimit(),cursor===START,true);
      return out;
    }
    function selected(){return blocks().find(b=>b.id===state.selected)||blocks()[0]}
    function select(id){state.selected=id;state.detailOpen=true;state.calendarOpen=false;state.tab='transcript';state.playhead=blocks().find(b=>b.id===id)?.start??null;state.noteDraft='';render()}

      const data=dayStore.get(date)||{events:[],segments:[],actions:[],manualAsr:[]};

        queue:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/>',

        settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2.8v2M12 19.2v2M21.2 12h-2M4.8 12h-2M18.5 5.5l-1.4 1.4M6.9 17.1l-1.4 1.4M18.5 18.5l-1.4-1.4M6.9 6.9 5.5 5.5"/>'
      };

    function navItem(id,label,count=''){
      return `<button class="nav-item ${state.view===id?'active':''}" data-action="nav" data-id="${id}"><span class="nav-icon">${icon(id)}</span><span>${label}</span>${count?`<span class="nav-count">${count}</span>`:''}</button>`
    }
    function renderSidebar(){
      const pending=allEvents().filter(e=>e.asr==='queued').length+allJobs().length;
      document.getElementById('sidebar').innerHTML=`<div class="brand"><div class="brand-logo">h.</div><div class="brand-name">hear</div></div><nav>${navItem('timeline','时间线')}${navItem('queue','处理',pending||'')}${navItem('people','人物')}${navItem('settings','设置')}</nav>`
    }
    function calendarMarkup(){
      const [year,month]=state.calendarMonth.split('-').map(Number);
      const first=new Date(Date.UTC(year,month-1,1));
      const offset=(first.getUTCDay()+6)%7;
      const count=new Date(Date.UTC(year,month,0)).getUTCDate();
      const cells=[...Array(offset).fill('<span></span>')];
      for(let day=1;day<=count;day++){
        const iso=`${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        cells.push(`<button class="calendar-day ${iso===state.date?'selected':''} ${dayStore.has(iso)?'has-record':''}" data-action="select-day" data-id="${iso}" ${iso>TODAY?'disabled':''}>${day}</button>`);
      }
      return `<div class="calendar-popover" role="dialog" aria-label="选择日期"><div class="calendar-month"><button data-action="calendar-month" data-id="-1" aria-label="上个月">‹</button><strong>${year}年${month}月</strong><button data-action="calendar-month" data-id="1" aria-label="下个月" ${state.calendarMonth>=TODAY.slice(0,7)?'disabled':''}>›</button></div><div class="calendar-grid calendar-week">${['一','二','三','四','五','六','日'].map(x=>`<span>${x}</span>`).join('')}</div><div class="calendar-grid">${cells.join('')}</div><div class="calendar-jump"><input id="calendar-date" type="date" max="${TODAY}" value="${state.date}" aria-label="跳转到日期"><button data-action="jump-date">前往</button></div></div>`
    }
    function dateNavigation(){
      const dates=state.date===TODAY?[state.date,shiftDate(state.date,-1),shiftDate(state.date,-2)]:[shiftDate(state.date,1),state.date,shiftDate(state.date,-1)];
      return `<nav class="day-date-track" aria-label="按日期浏览">${dates.map(date=>date===state.date?`<div class="day-date selected" aria-current="date"><h1>${dateTitle(date)}</h1><span class="date-caption">${weekday(date)}${date===TODAY?' · 今天':''}</span></div>`:`<button class="day-date" data-action="select-day" data-id="${date}" aria-label="查看${dateTitle(date)}"><span class="date-label">${Number(date.slice(5,7))} 月 ${Number(date.slice(8))} 日</span></button>`).join('')}</nav>`
    }
    function axis(){
      const pct=n=>((n-START)/DAY_END*100).toFixed(2)+'%';
      const width=(a,b)=>((b-a)/DAY_END*100).toFixed(2)+'%';
      const eventBars=blocks().map(b=>`<button class="daymap-block ${b.kind==='event'?'named':'gap'} ${state.detailOpen&&state.selected===b.id?'selected':''}" data-action="select" data-id="${b.id}" style="left:${pct(b.start)};width:${width(b.start,b.end)}" title="${time(b.start)}–${time(b.end)} · ${esc(b.title)}">${b.kind==='event'?esc(b.title):''}</button>`).join('');
      const sounds=src=>state.segments.filter(s=>s.source===src&&s.audio).map(s=>`<i class="daymap-sound ${src==='system'?'system':''}" style="left:${pct(s.at)};width:${width(s.at,Math.max(s.end,s.at+2))}" title="${time(s.at)}"></i>`).join('');
      const moments=state.actions.map(a=>`<i class="daymap-moment" style="left:${pct(a.at)}" title="${time(a.at)}"></i>`).join('');
      return `<section class="daymap" aria-label="${dateTitle(state.date)}时间概览"><div class="daymap-rail">${eventBars}${moments}</div><div class="daymap-sources"><span class="daymap-source-label">MIC</span><div class="daymap-source-rail">${sounds('mic')}</div></div><div class="daymap-sources"><span class="daymap-source-label">SYS</span><div class="daymap-source-rail">${sounds('system')}</div></div><div class="daymap-ticks"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div></section>`
    }
    function blockCard(b){
      const seg=blockSegments(b),acts=blockActions(b),first=seg[0];
      const excerpt=first?.corrected||first?.text||acts.map(a=>a.type==='screenshot'?'截图':a.type==='mark'?'标记':'评论').join(' · ');
      const duration=b.end-b.start;
      return `<div class="timeline-block ${b.kind==='event'?'named':''}"><div class="timeline-clock">${time(b.start)}</div><button class="block-button ${state.detailOpen&&state.selected===b.id?'selected':''}" data-action="select" data-id="${b.id}"><div class="block-top"><span class="block-time">${time(b.start)} — ${time(b.end)}</span><span class="block-status">${b.kind==='event'?statusText(b):`${seg.length} 段声音${acts.length?` · ${acts.length} 个标记`:''}`}</span></div><div class="block-title">${esc(b.title)}</div><div class="block-excerpt">${esc(excerpt||'')}</div>${b.kind==='event'?`<div class="block-foot"><span>${Math.floor(duration/60)?`${Math.floor(duration/60)} 小时${duration%60?` ${duration%60} 分`:''}`:`${duration} 分钟`}</span><span class="sep">·</span><span>${seg.length} 段声音</span>${acts.length?`<span class="sep">·</span><span>${acts.length} 个标记</span>`:''}</div>`:''}</button></div>`
    }
    function renderTimeline(){
      const list=blocks().filter(findMatch).sort((a,b)=>b.start-a.start||b.end-a.end);
      return `<div class="heading-row day-heading"><div class="day-title"><div class="calendar-wrap"><button class="calendar-trigger" data-action="toggle-calendar" aria-label="打开日历" title="选择日期"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg></button>${state.calendarOpen?calendarMarkup():''}</div>${dateNavigation()}</div></div>${!state.recording?`<div class="notice warning"><span class="dot paused"></span><strong>${esc(state.pauseReason||'录音已暂停')}</strong><button class="button small" data-action="toggle-record">恢复录音</button></div>`:''}${axis()}<div class="section-row"><h2>日程</h2><button class="button ghost" data-action="new-event">＋ 新建事件</button></div><div class="timeline">${list.length?list.map(blockCard).join(''):'<div class="empty">这一天没有记录</div>'}</div>`
    }
    function searchBar(){
      return `<form class="search-form" id="search-form"><input name="query" value="${esc(state.query)}" placeholder="搜索文字、评论、截图" aria-label="搜索"><button class="button primary">搜索</button></form><div class="filter-row"><select id="person-filter" aria-label="人物筛选"><option value="all">所有人物</option>${state.people.map(p=>`<option value="${p.id}" ${state.personFilter===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><span class="pill">${dateTitle(state.date)}</span><button class="button ghost" data-action="clear-search">清除</button></div>`
    }
    function renderSearch(){
      const results=blocks().filter(findMatch).sort((a,b)=>b.start-a.start||b.end-a.end);
      return `<div class="heading-row"><div><h1>搜索</h1></div></div>${searchBar()}<div class="section-row"><h2>${state.query||state.personFilter!=='all'?'结果':'今天'}</h2><small>${results.length} 段</small></div><div class="timeline">${results.map(blockCard).join('')||'<div class="empty">没有找到内容</div>'}</div>`
    }
    function renderQueue(){
      const latestFirst=(a,b)=>b.date.localeCompare(a.date)||b.start-a.start;
      const pending=allEvents().filter(e=>e.asr==='queued').sort(latestFirst),jobs=allJobs().sort(latestFirst),done=allEvents().filter(e=>e.asr==='done').sort(latestFirst);
      return `<div class="heading-row"><div><h1>处理</h1></div></div><div class="queue-divider">云端队列</div><div class="setting-card"><div class="setting-row"><div><strong>事件整理</strong><p>LLM · ${state.queues.llm?'运行中':'已暂停'}</p></div><button class="switch ${state.queues.llm?'on':''}" data-action="toggle-queue" data-id="llm" aria-label="切换事件整理"></button></div><div class="setting-row"><div><strong>精确转录</strong><p>ASR · ${state.queues.asr?'运行中':'已暂停'}</p></div><button class="switch ${state.queues.asr?'on':''}" data-action="toggle-queue" data-id="asr" aria-label="切换精确转录"></button></div></div><div class="queue-divider">待办 · ${pending.length+jobs.length}</div><div class="panel-list">${pending.map(e=>`<div class="panel-item"><div class="panel-item-head"><div><h3>${esc(e.title)}</h3><p>${dateTitle(e.date)} · ${time(e.start)} — ${time(e.end)}</p></div><button class="button small" data-action="open-event" data-id="${e.date}|${e.id}">查看</button></div></div>`).join('')}${jobs.map(j=>`<div class="panel-item"><h3>${dateTitle(j.date)} · ${time(j.start)} — ${time(j.end)}</h3><p>手动精转 · ${sourceName(j.source)}</p></div>`).join('')}${!pending.length&&!jobs.length?'<div class="empty">暂无待办</div>':''}</div><div class="queue-divider">已完成</div><div class="panel-list">${done.map(e=>`<div class="panel-item"><div class="panel-item-head"><div><h3>${esc(e.title)}</h3><p>${dateTitle(e.date)} · ${time(e.start)} — ${time(e.end)}</p></div><button class="button small" data-action="open-event" data-id="${e.date}|${e.id}">查看</button></div></div>`).join('')||'<div class="empty">暂无记录</div>'}</div>`
    }
    function renderPeople(){
      return `<div class="heading-row"><div><h1>人物</h1></div><button class="button" data-action="new-person">＋ 新建人物</button></div><div class="panel-list">${state.people.map(p=>`<div class="panel-item person-row"><div class="person-avatar">${esc(p.name.slice(0,1))}</div><div><strong>${esc(p.name)}</strong><small>${p.samples?`${p.samples} 段声纹样例`:'尚无声纹样例'}</small></div><button class="button small" data-action="edit-person" data-id="${p.id}">管理</button></div>`).join('')||'<div class="empty">还没有人物</div>'}</div>`
    }
    function renderSettings(){
      return `<div class="heading-row"><div><h1>设置</h1></div></div><div class="queue-divider">声音来源</div><div class="setting-card"><div class="setting-row"><div><strong>麦克风</strong></div><button class="switch ${state.mic?'on':''}" data-action="toggle-source" data-id="mic" aria-label="切换麦克风"></button></div><div class="setting-row"><div><strong>电脑声音</strong></div><button class="switch ${state.system?'on':''}" data-action="toggle-source" data-id="system" aria-label="切换电脑声音"></button></div></div><div class="queue-divider">云端处理</div><div class="setting-card"><div class="setting-row"><div><strong>事件整理</strong><p>LLM · 已配置</p></div><button class="switch ${state.queues.llm?'on':''}" data-action="toggle-queue" data-id="llm"></button></div><div class="setting-row"><div><strong>精确转录</strong><p>ASR · 已配置</p></div><button class="switch ${state.queues.asr?'on':''}" data-action="toggle-queue" data-id="asr"></button></div></div><div class="queue-divider">存储</div><div class="setting-card"><div class="setting-row"><div><strong>原声音频</strong><p>2.4 GB / 20 GB</p></div><button class="button small" data-action="simulate-storage">${state.storageAlert?'解除告警':'模拟空间不足'}</button></div><div class="setting-row"><div><strong>清理当日记录</strong></div><button class="button small" data-action="cleanup-day">预览</button></div><div class="setting-row"><div><strong>清理全部历史</strong></div><button class="button small" data-action="cleanup-history">预览</button></div></div><div class="queue-divider">其他</div><div class="setting-card"><div class="setting-row"><div><strong>首次启用</strong></div><button class="button small" data-action="onboarding">查看</button></div><div class="setting-row"><div><strong>命令行</strong><p>macOS 版完整功能</p></div></div></div>`
    }
    function renderMain(){let html=state.view==='timeline'?renderTimeline():state.view==='search'?renderSearch():state.view==='queue'?renderQueue():state.view==='people'?renderPeople():renderSettings();document.getElementById('main').innerHTML=html}
    function speakerLabel(s){if(!s.speaker)return '';const match=speakerMatch(s);return match?`${peopleName(match.personId)} · ${match.origin}`:`说话人 ${s.speaker.split(':')[1]}`}
    function speakerDisplay(s){
      if(!s.speaker)return '';
      const match=speakerMatch(s);
      return match?peopleName(match.personId):`说话人 ${s.speaker.split(':')[1]}`
    }
    function renderOverview(b){
      const seg=blockSegments(b),audio=seg.filter(s=>s.audio).length;
      const rows=[['时间',`${time(b.start)} — ${time(b.end)}`],['时长',time(b.end-b.start)],['来源',sourceName(b.source)],['原声',audio?`${audio} 段可回放`:'无可回放原声'],['本地转录',seg.length?'已生成':'无文字'],['精确转录',b.kind==='event'?statusText(b):state.manualAsr.some(j=>j.start>=b.start&&j.end<=b.end)?'待处理':'未发起']];
      return `<div class="status-list">${rows.map(([label,value])=>`<div class="status-line"><span>${label}</span><strong>${esc(value)}</strong></div>`).join('')}</div>`
    }
    function renderTranscript(b){
      const seg=blockSegments(b).sort((a,b)=>a.at-b.at||a.end-b.end);
      if(!seg.length)return '<div class="empty">暂无文字</div>';
      const pending=b.kind==='event'&&b.asr!=='done'?`<div class="status-line"><span>精确转录</span><strong>${statusText(b)}</strong></div>`:'';
      return `${pending}<div class="transcript-timeline">${seg.map(s=>{
        const match=speakerMatch(s);
        return `<div class="transcript-row ${state.playhead===s.at?'active':''}" data-at="${s.at}"><button class="transcript-time" data-action="seek-detail" data-id="${s.at}" title="定位到 ${time(s.at)}">${time(s.at)}</button><div class="transcript-entry"><div class="transcript-meta">${s.speaker?`<button class="speaker ${match?'':'unknown'}" data-action="assign-speaker" data-id="${s.speaker}" title="${match?.origin||'选择人物'}">${esc(speakerDisplay(s))} ▾</button>`:`<span class="speaker unknown">${s.rough?'本地文字':'说话人'}</span>`}</div><div class="transcript-text">${esc(s.corrected||s.text)}</div><div class="transcript-actions">${s.corrected?'<span>已修正</span>':''}${!s.rough?`<button class="text-link" data-action="edit-text" data-id="${s.id}">修改文字</button>${s.corrected?`<button class="text-link" data-action="undo-text" data-id="${s.id}">撤销</button>`:''}${s.speaker?`<button class="text-link" data-action="assign-utterance" data-id="${s.id}">修改本句人物</button>`:''}${match&&s.audio?`<button class="text-link" data-action="add-sample" data-id="${s.id}">加入声纹</button>`:''}`:''}</div></div></div>`
      }).join('')}</div>`
    }
    function renderMaterials(b){
      return `${blockSegments(b).sort((a,b)=>a.at-b.at).map(item=>`<div class="material-card"><strong>${time(item.at)} — ${time(item.end)} · ${sourceName(item.source)}</strong><div style="margin-top:9px"><button class="button small" data-action="play-audio" data-id="${item.id}" ${item.audio?'':'disabled'}>${item.audio?'▷ 播放':'原声已清理'}</button></div></div>`).join('')||'<div class="empty">暂无录音片段</div>'}`
    }
    function renderInfo(b){
      return `${renderOverview(b)}<h3 class="info-heading">录音片段</h3>${renderMaterials(b)}`
    }
    function renderPlayer(b,audio){
      const playhead=Math.min(Math.max(state.playhead??b.start,b.start),b.end-1);
      return `<div class="detail-player"><button class="detail-play" data-action="play-audio" data-id="${audio[0]?.id||''}" aria-label="播放原声" ${audio.length?'':'disabled'}>▶</button><div class="detail-player-track"><input id="detail-seek" type="range" min="${b.start}" max="${b.end-1}" value="${playhead}" aria-label="录音位置" ${audio.length?'':'disabled'}><div class="detail-player-times"><span id="detail-playhead-time">${time(playhead-b.start)}</span><span>${time(b.end-b.start)}</span></div></div><span class="detail-player-source">${sourceName(b.source)}</span></div>`
    }
    function seekDetail(at){
      const b=selected();if(!b)return;
      state.playhead=Math.min(Math.max(Number(at),b.start),b.end-1);
      const seek=document.getElementById('detail-seek'),elapsed=document.getElementById('detail-playhead-time'),anchor=document.getElementById('detail-note-anchor');
      if(seek)seek.value=state.playhead;if(elapsed)elapsed.textContent=time(state.playhead-b.start);if(anchor)anchor.textContent=time(state.playhead);
      if(document.querySelectorAll){for(const row of document.querySelectorAll('.transcript-row.active'))row.classList.remove('active');document.querySelector(`.transcript-row[data-at="${state.playhead}"]`)?.classList.add('active')}
    }
    function renderNotes(b){
      const actions=blockActions(b).sort((a,b)=>a.at-b.at);
      const messages=actions.map(item=>{
        const type=item.type==='mark'?'重点':item.type==='screenshot'?'截图':'笔记';
        const content=item.type==='mark'?'<span class="note-mark">✦ 已标记重点</span>':item.type==='screenshot'?`<span>${esc(item.note||'屏幕截图')}</span><div class="note-shot" aria-label="演示截图占位图"><span></span><i></i><i></i><i></i></div>`:`<span>${esc(item.text||'')}</span>`;
        return `<div class="note-message"><button class="note-time" data-action="seek-detail" data-id="${item.at}" title="定位到 ${time(item.at)}">${time(item.at)}</button><div class="note-bubble ${item.type}"><small>${type}</small>${content}</div></div>`
      }).join('');
      const anchor=Math.min(Math.max(state.playhead??b.start,b.start),b.end-1);
      return `<aside class="note-panel"><div class="note-panel-head"><h3>现场笔记</h3><span>${actions.length}</span></div><div class="note-feed" id="note-feed">${messages||'<div class="note-empty">还没有现场记录</div>'}</div><div class="note-compose"><textarea id="detail-note-input" placeholder="写下笔记…" aria-label="写笔记">${esc(state.noteDraft)}</textarea><div class="note-compose-foot"><span id="detail-note-anchor">${time(anchor)}</span><button class="button primary" id="detail-note-send" data-action="send-detail-note" ${state.noteDraft.trim()?'':'disabled'}>发送</button></div></div></aside>`
    }
    function sendDetailNote(){
      const b=selected(),draft=document.getElementById('detail-note-input');
      const message=String(draft?.value||state.noteDraft).trim();
      if(!b||!message)return;
      const at=Math.min(Math.max(state.playhead??b.start,b.start),b.end-1);
      state.actions.push({id:`a${Date.now()}`,at,type:'comment',text:message});
      state.noteDraft='';render();const feed=document.getElementById('note-feed');if(feed)feed.scrollTop=feed.scrollHeight;toast(`笔记已添加 · ${time(at)}`)
    }
    function renderDetail(){
      const root=document.getElementById('detail');
      if(!['timeline','search'].includes(state.view)){
        root.innerHTML='';
        return
      }
      const b=selected();
      if(!b){root.innerHTML='<div class="empty">暂无记录</div>';return}
      const seg=blockSegments(b),audio=seg.filter(s=>s.audio);
      root.innerHTML=`<div class="detail-shell"><div class="detail-head"><span class="eyebrow">${dateTitle(state.date)} · ${weekday(state.date)}</span><div class="drawer-tools"><button class="icon-button" data-action="more" title="更多操作" aria-label="更多操作">···</button><button class="icon-button close-detail" data-action="close-detail" title="关闭详情" aria-label="关闭详情">×</button></div></div><div class="detail-columns"><section class="detail-main"><div class="detail-intro"><div class="detail-time">${time(b.start)} — ${time(b.end)}</div><h2>${esc(b.title)}</h2><p class="detail-summary">${seg.length} 段声音${b.kind==='event'?' · '+statusText(b):''}</p>${b.kind==='gap'?`<div class="detail-actions"><button class="button primary" data-action="new-event" data-id="${b.id}">建立事件</button><button class="button" data-action="manual-asr" data-id="${b.id}">精确转录</button></div>`:''}</div>${renderPlayer(b,audio)}<div class="tabs"><button class="tab ${state.tab==='transcript'?'active':''}" data-action="tab" data-id="transcript">文本转录</button><button class="tab ${state.tab==='overview'?'active':''}" data-action="tab" data-id="overview">音频信息</button></div><div class="detail-body">${state.tab==='overview'?renderInfo(b):renderTranscript(b)}</div></section>${renderNotes(b)}</div></div>`
      const feed=document.getElementById('note-feed');if(feed)feed.scrollTop=feed.scrollHeight;
    }
    function renderFloating(){
      document.getElementById('floating').innerHTML=`<div class="float-wrap"><div class="float-label">重点</div><div class="float-menu"><button data-action="toggle-record">${state.recording?'Ⅱ 暂停':'▶ 恢复'}</button><button data-action="comment">✎ 评论</button><button data-action="screenshot">▣ 截屏</button></div><button class="float-main ${state.recording?'':'paused'}" data-action="mark" title="重点" aria-label="标记重点"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 14.4 9.6 21.5 12l-7.1 2.4L12 21.5l-2.4-7.1L2.5 12l7.1-2.4z"/></svg></button></div>`
    }
    function render(){
      document.getElementById('app').classList.toggle('drawer-open',state.detailOpen);
      document.getElementById('drawer-backdrop').classList.toggle('open',state.detailOpen);
      renderSidebar();renderMain();renderDetail();renderFloating();renderModal();
    }

    function renderModal(){const root=document.getElementById('modal-root');if(!modal){root.innerHTML='';return}const html=modal.type==='event'?eventModal(false):modal.type==='edit-event'?eventModal(true):modal.type==='asr'?asrModal():modal.type==='assign'?assignModal():modal.type==='correction'?correctionModal():modal.type==='cleanup'?cleanupModal():modal.type==='cleanup-confirm'?cleanupConfirm():modal.type==='export'?exportModal():modal.type==='more'?moreModal():modal.type==='split'?splitModal():modal.type==='person'?personModal():modal.type==='comment'?modalShell('写下这一刻','16:17',`<form id="comment-form"><div class="field"><label>评论内容</label><textarea name="text" required placeholder="写下你想保留的上下文"></textarea></div></form>`,`<button class="button primary" data-action="save-comment">保存评论</button>`):modal.type==='onboarding'?modalShell('首次启用','',`<div class="panel-list"><div class="panel-item"><strong>1 · 了解记录边界</strong><p>登录且电脑醒着时持续记录；睡眠、关机和应用完全退出时不采集。</p></div><div class="panel-item"><strong>2 · 权限与本地模型</strong><p>麦克风、电脑声音和主动截图分别授权；本地模型完成安装和试录。</p></div><div class="panel-item"><strong>3 · 配置两项云能力</strong><p>LLM 接收粗转文字和时间；ASR 接收需要精转的原声。</p></div><div class="panel-item"><strong>4 · 明确开启</strong><p>由用户点“开始持续记录”，之后按启用意图自动恢复。</p></div></div>`,`<button class="button primary" data-action="close-modal">知道了</button>`):'';root.innerHTML=html}
    function currentBlockId(at){return blocks().find(b=>between(at,b.start,b.end))?.id||selected()?.id}

    function validateRange(start,end){if(!Number.isFinite(start)||!Number.isFinite(end)||start<START||end>dayLimit()||start>=end){toast(`请选择 00:00—${time(dayLimit())} 内有效的起止时间`);return false}return true}
    function saveEvent(){const f=getForm('event-form'),title=String(f.get('title')||'').trim(),start=parseTime(f.get('start')),end=parseTime(f.get('end')),source=String(f.get('source'));if(!title||!validateRange(start,end))return;const edit=modal.type==='edit-event',id=edit?selected().id.slice(6):null;const conflict=state.events.find(e=>e.id!==id&&start<e.end&&end>e.start&&intersects(source,e.source));if(conflict){toast(`与「${conflict.title}」在同一声音来源上重叠，请先调整边界`);return}const hasAudio=state.segments.some(s=>s.audio&&between(s.at,start,end)&&sourceSet(source).includes(s.source));if(edit){const e=state.events.find(x=>x.id===id);Object.assign(e,{title,start,end,source,asr:hasAudio?'queued':'unavailable',origin:'人工修订',manualTitle:true});state.selected=`event:${id}`;toast(hasAudio?'边界已更新，等待精转':'边界已更新；范围内没有可精转的原声')}else{const newId=`e${Date.now()}`;state.events.push({id:newId,start,end,title,source,asr:hasAudio?'queued':'unavailable',origin:'手动创建',manualTitle:true});state.selected=`event:${newId}`;toast(hasAudio?'事件已建立，等待精转':'事件已建立；范围内没有可精转的原声')}state.view='timeline';state.detailOpen=true;closeModal();render()}
    function performCleanup(){
      const scope=modal.scope,blockId=modal.blockId,mode=modal.mode;
      if(scope==='history'){
        for(const [,data] of dayEntries()){
          if(mode==='audio'){
            data.segments.forEach(s=>s.audio=false);
            data.events.forEach(e=>{if(e.asr==='queued')e.asr='unavailable'});
            data.manualAsr.length=0;
          }else{
            data.events.length=0;data.segments.length=0;data.actions.length=0;data.manualAsr.length=0;
          }
        }
        if(mode==='all'){state.people=[];state.assignments={};state.segmentAssignments={}}
        persistDay();state.selected=undefined;state.detailOpen=false;closeModal();render();
        toast(mode==='audio'?'全部历史的原声已清除':'全部历史已清除');
        return;
      }
      const b=scope==='all'?{start:START,end:dayLimit(),source:'both'}:blocks().find(x=>x.id===blockId)||selected();
      if(mode==='audio'){
        state.segments.forEach(s=>{if(between(s.at,b.start,b.end)&&sourceSet(b.source).includes(s.source))s.audio=false});
        state.events.forEach(e=>{if(e.asr==='queued'&&e.start<b.end&&e.end>b.start)e.asr='unavailable'});
        state.manualAsr=state.manualAsr.filter(j=>j.end<=b.start||j.start>=b.end);
        toast('原声已清除；文字和声纹特征保留');
      }else{
        state.segments=state.segments.filter(s=>!(between(s.at,b.start,b.end)&&sourceSet(b.source).includes(s.source)));
        state.actions=state.actions.filter(a=>!between(a.at,b.start,b.end));
        state.events=state.events.filter(e=>!(e.start>=b.start&&e.end<=b.end&&intersects(e.source,b.source)));
        state.manualAsr=state.manualAsr.filter(j=>j.end<=b.start||j.start>=b.end);
        const survivors=allSegments(),ids=new Set(survivors.map(s=>s.id)),speakers=new Set(survivors.map(s=>s.speaker).filter(Boolean));
        Object.keys(state.assignments).forEach(key=>{if(!speakers.has(key))delete state.assignments[key]});
        Object.keys(state.segmentAssignments).forEach(id=>{if(!ids.has(id))delete state.segmentAssignments[id]});
        state.people.forEach(p=>{p.sampleSegments=(p.sampleSegments||[]).filter(id=>ids.has(id));p.samples=p.sampleSegments.length});
        const referenced=new Set([...Object.values(state.assignments),...Object.values(state.segmentAssignments)].map(x=>x.personId));
        state.people=state.people.filter(p=>p.createdOn!==state.date||p.samples||referenced.has(p.id));
        toast('所选内容已清除');
      }
      closeModal();state.selected=blocks()[0]?.id;state.detailOpen=false;render();
    }

    document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,id=el.dataset.id;if(action==='nav')return nav(id);if(action==='open-event'){const [date,eventId]=id.split('|');changeDate(date);return select(`event:${eventId}`)}if(action==='close-detail'){state.detailOpen=false;render();return}if(action==='toggle-calendar'){state.calendarOpen=!state.calendarOpen;renderMain();return}if(action==='calendar-month'){const d=new Date(`${state.calendarMonth}-01T12:00:00Z`);d.setUTCMonth(d.getUTCMonth()+Number(id));state.calendarMonth=d.toISOString().slice(0,7);renderMain();return}if(action==='select-day')return changeDate(id);if(action==='jump-date')return changeDate(document.getElementById('calendar-date').value);if(action==='select')return select(id);if(action==='seek-detail'){seekDetail(id);return}if(action==='send-detail-note')return sendDetailNote();if(action==='tab'){state.tab=id;renderDetail();return}if(action==='close-modal')return closeModal();if(action==='new-event')return openModal('event',{blockId:id||defaultNewEventBlock()});if(action==='edit-event'){closeModal();return openModal('edit-event')};if(action==='manual-asr')return openModal('asr',{blockId:id});if(action==='assign-speaker')return openModal('assign',{key:id});if(action==='assign-utterance'){const s=state.segments.find(x=>x.id===id);return openModal('assign',{key:s.speaker,segmentId:id})}if(action==='edit-text')return openModal('correction',{segmentId:id});if(action==='undo-text'){delete state.segments.find(s=>s.id===id).corrected;toast('已恢复原识别文字');render();return}if(action==='cleanup')return openModal('cleanup',{blockId:id,scope:'block',mode:'audio'});if(action==='cleanup-day')return openModal('cleanup',{scope:'all',mode:'audio'});if(action==='cleanup-history')return openModal('cleanup',{scope:'history',mode:'audio'});if(action==='cleanup-next'){if((modal.mode||'audio')==='all'){modal.type='cleanup-confirm';renderModal()}else performCleanup();return}if(action==='cleanup-execute'){modal.mode='all';performCleanup();return}if(action==='export')return openModal('export',{blockId:id});if(action==='more')return openModal('more');if(action==='split-event'){closeModal();return openModal('split')};if(action==='new-person')return openModal('person');if(action==='edit-person')return openModal('person',{personId:id});if(action==='onboarding')return openModal('onboarding');if(action==='clear-search'){state.query='';state.personFilter='all';render();return}
      if(action==='toggle-queue'){state.queues[id]=!state.queues[id];toast(`${id==='llm'?'LLM 事件拟合':'ASR 精确转录'}已${state.queues[id]?'继续':'暂停'}`);render();return}

      if(action==='save-comment'){const text=String(getForm('comment-form').get('text')||'').trim();if(!text){toast('请先写下评论');return}const at=NOW-1;activeActions().push({id:`a${Date.now()}`,at,type:'comment',text});closeModal();render();toast('评论已保存 · 16:17');return}
      if(action==='save-event')return saveEvent();if(action==='save-asr'){const f=getForm('asr-form'),start=parseTime(f.get('start')),end=parseTime(f.get('end')),source=String(f.get('source'));if(!validateRange(start,end))return;if(!state.segments.some(s=>s.audio&&between(s.at,start,end)&&sourceSet(source).includes(s.source))){toast('此范围没有可精转的原声音频');return}state.manualAsr.push({id:`j${Date.now()}`,start,end,source});closeModal();render();toast(state.queues.asr?'手动精转已加入队列':'请求已保存；ASR 队列暂停中');return}
      if(action==='save-assignment'){const f=getForm('assign-form'),existing=String(f.get('person')||''),name=String(f.get('name')||'').trim();let person=state.people.find(p=>p.id===existing);if(!person&&!name){toast('请选择已有的人，或输入新名字');return}if(!person){person={id:`p${Date.now()}`,name,samples:0,sampleSegments:[],createdOn:state.date};state.people.push(person)}if(modal.segmentId)state.segmentAssignments[modal.segmentId]={personId:person.id,origin:'人工确认 · 本句'};else state.assignments[modal.key]={personId:person.id,origin:'人工确认'};const candidate=modal.segmentId?state.segments.find(s=>s.id===modal.segmentId):state.segments.find(s=>s.speaker===modal.key&&s.audio&&!s.rough);if(candidate?.audio&&!candidate.rough){person.sampleSegments ||= [];if(!person.sampleSegments.includes(candidate.id))person.sampleSegments.push(candidate.id);person.samples=person.sampleSegments.length}closeModal();render();toast(`已确认 ${person.name}；人物库可在其他事件中复用`);return}
      if(action==='save-correction'){const t=String(getForm('correction-form').get('text')||'').trim();if(!t){toast('修正文字不能为空');return}state.segments.find(s=>s.id===modal.segmentId).corrected=t;closeModal();render();toast('逐句修正已保存，原识别结果仍可核对');return}
      if(action==='save-split'){const b=selected(),e=state.events.find(x=>`event:${x.id}`===b.id),f=getForm('split-form'),at=parseTime(f.get('at')),title=String(f.get('title')||'').trim();if(!e||!title||at<=e.start||at>=e.end){toast('拆分点必须落在事件内部');return}const newId=`e${Date.now()}`;state.events.push({...e,id:newId,start:at,title,asr:'queued',origin:'人工拆分'});e.end=at;e.asr='queued';closeModal();render();toast('事件已拆成两个区间；精转范围将重新核对');return}
      if(action==='merge-event'){const b=selected(),list=[...state.events].sort((a,b)=>a.start-b.start),index=list.findIndex(x=>`event:${x.id}`===b?.id),a=list[index],next=list[index+1];if(!a||!next||!intersects(a.source,next.source)){toast('当前没有可直接合并的相邻同源事件');return}a.end=next.end;a.title=`${a.title} / ${next.title}`;a.asr='queued';state.events=state.events.filter(x=>x.id!==next.id);closeModal();render();toast('相邻事件已合并，真实素材未移动');return}
      if(action==='cancel-event'){const b=selected();state.events=state.events.filter(x=>`event:${x.id}`!==b?.id);closeModal();state.selected=currentBlockId(b.start);render();toast('事件标注已取消；素材回到原时间位置的未整理段');return}
      if(action==='add-sample'){const seg=state.segments.find(s=>s.id===id),match=speakerMatch(seg),person=state.people.find(p=>p.id===match?.personId);if(!seg?.audio||!person){toast('需要仍有原声且已确认身份的句段');return}person.sampleSegments ||= [];if(!person.sampleSegments.includes(id))person.sampleSegments.push(id);person.samples=person.sampleSegments.length;render();toast('这段清晰发言已加入人物的演示声纹样例');return}
      if(action==='remove-sample'){const [personId,segmentId]=id.split(':'),person=state.people.find(p=>p.id===personId);person.sampleSegments=(person.sampleSegments||[]).filter(x=>x!==segmentId);person.samples=person.sampleSegments.length;render();toast('样例已移除，原声与文字仍保留');return}
      if(action==='save-person'){const name=String(getForm('person-form').get('name')||'').trim();if(!name){toast('请输入人物名称');return}const p=state.people.find(x=>x.id===modal.personId);if(p)p.name=name;else state.people.push({id:`p${Date.now()}`,name,samples:0,sampleSegments:[],createdOn:state.date});closeModal();render();toast('人物档案已保存');return}
      if(action==='delete-person'){const id=modal.personId;state.people=state.people.filter(p=>p.id!==id);Object.keys(state.assignments).forEach(k=>{if(state.assignments[k].personId===id)delete state.assignments[k]});Object.keys(state.segmentAssignments).forEach(k=>{if(state.segmentAssignments[k].personId===id)delete state.segmentAssignments[k]});closeModal();render();toast('人物已删除；原转录和声音仍保留');return}
      if(action==='export-confirm'){const b=blocks().find(x=>x.id===modal.blockId)||selected(),payload={playground:true,range:{start:time(b.start),end:time(b.end),source:b.source},title:b.title,includeAudio:document.getElementById('export-audio').checked,includeScreenshots:document.getElementById('export-shots').checked,transcript:blockSegments(b).map(s=>({time:time(s.at),source:s.source,text:s.corrected||s.text,recognition:s.rough?'local-rough':'cloud-asr',speaker:s.speaker?speakerLabel(s):null,manuallyCorrected:!!s.corrected})),actions:blockActions(b).filter(a=>a.type!=='screenshot'||document.getElementById('export-shots').checked).map(a=>({time:time(a.at),type:a.type,note:a.note||a.text||null}))};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='hear-playground-export.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);closeModal();toast('演示清单已下载；实际媒体文件不在此试验稿中');return}
    });
    document.addEventListener('keydown',e=>{if(e.target?.id==='detail-note-input'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();sendDetailNote();return}if(e.key!=='Escape')return;if(modal)closeModal();else if(state.calendarOpen){state.calendarOpen=false;renderMain()}else if(state.detailOpen){state.detailOpen=false;render()}});
    render();
  </script>
