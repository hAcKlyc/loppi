<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>loppi Agent 接入回归</title>
<style>#root{padding:40px;max-width:1200px;margin:auto}aside{position:fixed;bottom:8px;right:8px;z-index:10000;background:white;padding:12px;border-radius:12px;max-width:650px;font:13px system-ui}</style>
<div id="root"></div><aside><button id="run">运行接入回归</button><output id="result">合成数据，不连接录音或云端</output></aside>
<script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import {mockIPC} from '@tauri-apps/api/mocks';
import {AgentAccess} from '/src/AgentAccess.tsx';
import '/src/App.css';
let connectionMode=new URLSearchParams(location.search).get('state')||'online',copyFails=false,copied='';
const cli='/Applications/loppi.app/Contents/MacOS/loppi';
const isWindows=new URLSearchParams(location.search).get('platform')==='windows';
const source=isWindows?'D:\\用户资料 with spaces\\skills\\loppi':'/Users/example/Library/Application Support/loppi/skills/loppi';
const prompt=`请将下列本机文件夹中的 loppi Skill 复制并安装到当前工作区适用的技能目录，然后读取 SKILL.md，按其中指引运行 CLI 的 readme 和 --help 验证接入。保留已有的用户自定义内容。\n\nSkill 文件夹：\n${source}`;
window.isTauri=true;
mockIPC(async(command,args)=>{
 if(command==='agent_access_info'){
  if(connectionMode==='error')throw 'Official SKILL.md is not a regular file';
  return {cli_path:cli,cli_available:connectionMode!=='missing',codex_config:`[mcp_servers.loppi]\ncommand = "${cli}"\nargs = ["mcp", "serve"]`,mcp_config:{mcpServers:{loppi:{command:cli,args:['mcp','serve']}}},skill_prompt:prompt,status:{ok:connectionMode!=='incompatible',data:{online:connectionMode==='online'},error:connectionMode==='incompatible'?{code:'core_incompatible'}:undefined}};
 }
 if(command==='copy_agent_text'){if(copyFails)throw Error('fixture');copied=args.text;return;}
 throw Error(command);
},{shouldMockEvents:true});
createRoot(document.getElementById('root')).render(React.createElement(AgentAccess));
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const waitFor=async fn=>{for(let i=0;i<100;i++){if(fn())return;await wait(30)}throw Error('UI timeout')};
const button=text=>[...document.querySelectorAll('button')].find(b=>b.textContent.trim()===text);
const assert=(condition,message)=>{if(!condition)throw Error(message)};
document.getElementById('run').onclick=async()=>{
 const output=document.getElementById('result');output.textContent='检查中…';
 try{
  await waitFor(()=>button('复制配置'));
  button('复制配置').click();await waitFor(()=>copied.includes('mcpServers'));
  document.querySelector('input[value=codex]')?.click();await wait(30);
  assert(document.querySelector('.agent-code').textContent.includes('[mcp_servers.loppi]'),'MCP配置名不正确');
  const tab=document.querySelector('[role=tab][aria-selected=true]');tab.focus();tab.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));
  assert(document.activeElement?.textContent==='CLI + Skill','键盘焦点错误');document.activeElement.click();
  await waitFor(()=>button('复制安装提示词'));
  button('复制安装提示词').click();await waitFor(()=>copied===prompt);
  assert(!document.querySelector('details')&&!document.querySelector('footer'),'冗余区域仍存在');
  copyFails=true;button('复制安装提示词').click();await waitFor(()=>document.querySelector('.agent-copy-feedback').textContent.includes('复制失败'));copyFails=false;
  for(const mode of ['offline','incompatible','missing','error','online']){
   connectionMode=mode;button('刷新').click();await wait(90);
   if(mode==='error')assert(document.querySelector('[role=alert]').textContent.includes('Official SKILL.md is not a regular file'),'未显示实际来源错误');
   assert(document.querySelector('.agent-access').textContent.includes({offline:'后台未连接',incompatible:'需要重新打开',missing:'未找到随 App',error:'暂时无法读取',online:'本机可用'}[mode]),'状态错误 '+mode);
  }
  assert(document.querySelector('.agent-access').scrollWidth<=document.querySelector('.agent-access').clientWidth,'页面横向溢出');
  assert(!document.querySelector('.agent-access [data-tauri-drag-region] button'),'拖拽区域覆盖按钮');
  output.textContent='PASS · MCP配置 / 键盘切换 / 安装提示词 / 复制失败 / 五种连接状态 / 无横向溢出';
 }catch(error){output.textContent='FAIL · '+error.message;throw error;}
};
</script></html>
