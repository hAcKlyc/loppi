<!-- Run npm run dev, open /scripts/test_date_navigation.html in a visible browser tab, then click the regression button. Uses mocked IPC only. -->
<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>loppi 日期切换回归</title>
<div id="root"></div><aside style="position:fixed;bottom:8px;right:8px;z-index:10000;background:white;padding:12px;border-radius:12px;max-width:650px;font:13px system-ui"><button id="run">运行日期切换回归</button><output id="result">使用本地模拟数据，不连接录音或云端</output></aside>
<script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import {mockIPC} from '@tauri-apps/api/mocks';
import App from '/src/App.tsx';
const NativeDate=Date;
const baseMatch=/^(\d{4})-(\d{2})-(\d{2})$/.exec(new URLSearchParams(location.search).get('base')??'');
const fixedNow=(baseMatch?new NativeDate(Number(baseMatch[1]),Number(baseMatch[2])-1,Number(baseMatch[3]),12):new NativeDate(2026,10,1,12)).getTime();
let currentNow=fixedNow;
window.Date=class extends NativeDate {
  constructor(...args){super(...(args.length?args:[currentNow]));}
  static now(){return currentNow;}
};
const now=new Date(),y=now.getFullYear(),m=now.getMonth(),current=now.getDate();
const day=(year,month,date)=>new Date(year,month,date).getTime();
const today=day(y,m,current),recent=day(y,m,current-10),short=day(y,0,1),long=day(y-1,11,31),ancient=day(y-100,0,1);
const days=[...new Set([ancient,long,short,recent,today])].sort((a,b)=>a-b);
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
let failAdjacent=false,heldDay=null,pending=[];
const requests=[];
const state={revision:1,enabled_intent:true,paused_intent:true,storage_paused:false,microphone_enabled:true,system_enabled:true,capture_state:'paused',microphone_phase:'idle',system_phase:'idle',microphone_recording:false,system_recording:false};
window.isTauri=true;
mockIPC(async(command,args)=>{
  if(command==='onboarding_status')return {completed:true};
  if(command==='entry_snapshot')return {sequence:1,state,error:null,mode:'top',appearance:'sleeping',detail:null,control:'resume',notice:null};
  if(command==='privacy_status')return {microphone:1,screen_and_system_audio:1,tap_required:false,tap_ready:true};
  if(command==='login_item_status')return 1;
  if(command!=='core_request')return null;
  const r=args.request;requests.push(r);
  if(r.type==='calendar_days')return {type:r.type,days:days.filter(d=>d>=r.boundaries[0]&&d<r.boundaries.at(-1))};
  if(r.type==='calendar_adjacent'){
    if(failAdjacent)throw Error('synthetic availability failure');
    const result={type:r.type,newer_ms:days.find(d=>d>=r.to_ms)??null,older_ms:days.findLast(d=>d<r.from_ms)??null};
    if(r.from_ms===heldDay)return new Promise(resolve=>pending.push(()=>resolve(result)));
    return result;
  }
  if(r.type==='timeline'){
    await wait(80);
    return {type:r.type,gaps:[],items:days.includes(r.from_ms)?[{id:`fixture-${r.from_ms}`,manual_range_id:null,title:`${new Date(r.from_ms).getFullYear()}年${new Date(r.from_ms).getMonth()+1}月${new Date(r.from_ms).getDate()}日的记录`,summary:'隔离合成记录，用于验证跳过空日、跨年与日期标题几何。',started_ms:r.from_ms+3600000,ended_ms:r.from_ms+7200000,sources:'microphone',revision:1,processing_state:'transcribed',recording_sources:[],preview:null,coarse_segments:[],precise_segments:[]}]:[]};
  }
  if(r.type==='moments')return {type:r.type,moments:[]};
  if(r.type==='cloud_status')return {type:r.type,queues:[]};
  if(r.type==='people')return {type:r.type,people:[]};
  if(r.type==='models')return {type:r.type,state:{phase:'ready',speaker_phase:'ready',progress_percent:100}};
  return {type:r.type,state,items:[],tasks:[]};
},{shouldMockEvents:true});
createRoot(document.getElementById('root')).render(React.createElement(App));
const assert=(condition,message)=>{if(!condition)throw Error(message)};
const q=s=>document.querySelector(s),selected=()=>q('.date-choice')?.dataset.date;
const iso=ms=>{const d=new Date(ms);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const previous=()=>q('[aria-label="上一个有记录的日期"]'),next=()=>q('[aria-label="下一个有记录的日期"]');
const until=async check=>{for(let i=0;i<150;i++){if(check())return;await wait(20)}throw Error('日期读取超时')};
const click=async el=>{assert(el&&!el.disabled,'缺少可用操作');el.click();await wait(30)};
const ready=async ms=>until(()=>selected()===iso(ms)&&q('.record-count')?.textContent==='1'&&(ms===days[0]?!next().disabled:!previous().disabled));
const evidence=[];
const geometry=()=>{
  const rect=selector=>{const r=q(selector).getBoundingClientRect();return {left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width}};
  const textWidth=selector=>{const range=document.createRange();range.selectNodeContents(q(selector));return range.getBoundingClientRect().width};
  const titleWidth=textWidth('.date-choice strong'),contextWidth=textWidth('.date-context span')+(q('.date-today')?q('.date-today').getBoundingClientRect().width+parseFloat(getComputedStyle(q('.date-context')).columnGap):0);
  const e={date:selected(),titleWidth,contextWidth,copy:rect('.date-copy'),arrows:rect('.date-step-controls'),newer:rect('[aria-label="下一个有记录的日期"]'),older:rect('[aria-label="上一个有记录的日期"]')};
  assert(e.copy.width+0.5>=Math.max(titleWidth,contextWidth),'日期标题或跨年说明超出固定预留宽度');
  const baseline=evidence[0];
  if(baseline)for(const key of ['left','right','top','bottom'])for(const part of ['newer','older'])assert(Math.abs(e[part][key]-baseline[part][key])<0.5,`日期 ${e.date} 的箭头发生位移`);
  evidence.push(e);
};
window.__LOPPI_DATE_FIXTURE__={days,requests,evidence};
document.getElementById('run').onclick=async()=>{
 const output=q('#result');output.textContent='检查中…';q('#run').disabled=true;evidence.length=0;
 try{
  await ready(today);const anchor=q('.date-choice');
  const arrows=[...document.querySelectorAll('.date-step-controls button')];
  assert(arrows.length===2&&arrows[0]===next()&&arrows[1]===previous(),'倒序必须左更新、右更早');
  assert(next().disabled&&!q('.date-today'),'最新边界或今天快捷入口错误');
  assert(!q('.calendar-button')&&document.querySelectorAll('.date-header [aria-haspopup="dialog"]').length===1,'重复日历入口');
  assert(getComputedStyle(q('.date-header')).userSelect==='none','日期仍可被双击选中文字');
  geometry();
  for(const target of days.slice(0,-1).reverse()){
    await click(previous());await ready(target);geometry();
    assert(q('.date-choice')===anchor,'日期DOM被替换');
    assert(document.activeElement===anchor,'导航焦点未留在可用日期入口');
  }
  assert(previous().disabled&&!next().disabled,'最早边界未禁用');
  for(const target of days.slice(1)){await click(next());await ready(target);geometry()}
  assert(next().disabled,'最近边界未禁用');
  assert(evidence.some(e=>e.date===iso(short))&&evidence.some(e=>e.date===iso(long)),'未覆盖短长日期');
  const pointerClick=async el=>{el.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true}));await click(el)};
  await pointerClick(anchor);assert(q('.calendar-popover'),'日期不能打开月历');
  await pointerClick(anchor);assert(!q('.calendar-popover'),'再次点击不能关闭月历');
  await pointerClick(anchor);q('.calendar-popover').dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));await wait(30);
  assert(document.activeElement===anchor&&!q('.calendar-popover'),'月历关闭未返回焦点');
  // A held older read must not replace the neighbors after direct selection of today.
  if(short<today){
    for(const target of days.slice(0,-1).reverse()){await click(previous());await ready(target);if(target===short)break}
    heldDay=long;await click(previous());await until(()=>selected()===iso(long)&&pending.length>0);
    await click(q('.date-today'));await ready(today);
    heldDay=null;for(const resolve of pending.splice(0))resolve();await wait(150);
    assert(selected()===iso(today)&&next().disabled,'迟到回复污染当前日期');
  }
  failAdjacent=true;currentNow+=300;window.dispatchEvent(new Event('focus'));
  await until(()=>previous().disabled&&next().disabled);
  assert(selected()===iso(today),'失败读取造成跳转');
  failAdjacent=false;currentNow+=300;window.dispatchEvent(new Event('focus'));await ready(today);
  assert(requests.filter(r=>r.type==='calendar_days').length<30,'枚举历史月份');
  assert(q('.date-track').getAnimations({subtree:true}).length===0,'日期仍有移动动画');
  assert(q('.main-area').scrollWidth<=q('.main-area').clientWidth+1,'主区域横向溢出');
  output.textContent='PASS：固定短长日期/跨年箭头坐标、左更新右更早、跳过空日、跨百年历史、两侧边界、连续点击、稳定DOM、单日期入口、键盘焦点、月历与今天直达、失败及迟到回复保护。';
 }catch(error){output.textContent='FAIL：'+error.message}finally{q('#run').disabled=false}
};
</script></html>
