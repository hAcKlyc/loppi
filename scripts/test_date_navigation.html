<!-- Run npm run dev, open /scripts/test_date_navigation.html in a visible browser tab, then click the regression button. Uses mocked IPC only. -->
<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>loppi 日期切换回归</title>
<div id="root"></div><aside style="position:fixed;bottom:8px;right:8px;z-index:10000;background:white;padding:12px;border-radius:12px;max-width:650px;font:13px system-ui"><button id="run">运行日期切换回归</button><output id="result">使用本地模拟数据，不连接录音或云端</output></aside>
<script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import {flushSync} from 'react-dom';
import {mockIPC} from '@tauri-apps/api/mocks';
import App from '/src/App.tsx';
const NativeDate=Date;
const baseMatch=/^(\d{4})-(\d{2})-(\d{2})$/.exec(new URLSearchParams(location.search).get('base')??'');
const fixedNow=(baseMatch?new NativeDate(Number(baseMatch[1]),Number(baseMatch[2])-1,Number(baseMatch[3]),12):new NativeDate(2026,9,17,12)).getTime();
window.Date=class extends NativeDate {
  constructor(...args){super(...(args.length?args:[fixedNow]));}
  static now(){return fixedNow;}
};
const now=new Date(), y=now.getFullYear(), m=now.getMonth();
const day=n=>new Date(y,m,n).getTime();
const current=now.getDate();
const older=Math.max(1,current-10), oldest=Math.max(1,current-11);
const days=[day(oldest-1),day(oldest),day(older),day(current)];
let failCalendar=false;
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const state={revision:1,enabled_intent:true,paused_intent:true,storage_paused:false,microphone_enabled:true,system_enabled:true,capture_state:'paused',microphone_phase:'idle',system_phase:'idle',microphone_recording:false,system_recording:false};
if(!window.isTauri)window.isTauri=true;
mockIPC(async(command,args)=>{
  if(command==='onboarding_status') return {completed:true};
  if(command==='entry_snapshot') return {sequence:1,state,error:null,mode:'top',appearance:'sleeping',detail:null,control:'resume',notice:null};
  if(command==='privacy_status') return {microphone:1,screen_and_system_audio:1,tap_required:false,tap_ready:true};
  if(command==='login_item_status') return 1;
  if(command!=='core_request') return null;
  const r=args.request;
  if(r.type==='calendar_days') {await wait(80);if(failCalendar){failCalendar=false;throw Error('simulated calendar failure')}return {type:r.type,days:days.filter(d=>d>=r.boundaries[0]&&d<r.boundaries.at(-1))};}
  if(r.type==='timeline') {
    await wait(r.from_ms===day(older)?700:150);
    const d=new Date(r.from_ms).getDate();
    return {type:'timeline',gaps:[],items:days.includes(r.from_ms)?[{id:`fixture-${d}`,manual_range_id:null,title:`日期 ${d} 的记录`,summary:'测试记录，用来核对日期与内容是否一致。',started_ms:r.from_ms+3600000,ended_ms:r.from_ms+7200000,sources:'microphone',revision:1,processing_state:'transcribed',recording_sources:[],preview:null,coarse_segments:[],precise_segments:[]}]:[]};
  }
  if(r.type==='moments') return {type:r.type,moments:[]};
  if(r.type==='cloud_status') return {type:r.type,queues:[]};
  if(r.type==='people') return {type:r.type,people:[]};
  if(r.type==='models') return {type:r.type,state:{phase:'ready',speaker_phase:'ready',progress_percent:100}};
  return {type:r.type,state,items:[],tasks:[]};
},{shouldMockEvents:true});
createRoot(document.getElementById('root')).render(React.createElement(App));
const assert=(condition,message)=>{if(!condition)throw Error(message)};
const q=s=>document.querySelector(s);
const selected=()=>q('.date-choice').dataset.date;
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const previous=()=>q('[aria-label="前一天"]'),next=()=>q('[aria-label="后一天"]');
const click=async el=>{assert(el,'缺少操作');el.click();await wait(80)};
const closeCalendar=async()=>{q('.calendar-popover').dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));await wait(50)};
document.getElementById('run').onclick=async()=>{
 const output=q('#result');output.textContent='检查中…';q('#run').disabled=true;
 try {
  await wait(600);const anchor=q('.date-choice');
  assert(selected()===iso(now)&&next().disabled&&!q('.date-today'),'今天的边界或快捷入口错误');
  await click(previous());assert(selected()===iso(new Date(y,m,current-1))&&q('.date-choice')===anchor,'没有逐日切换或替换了日期DOM');
  await wait(250);assert(q('.list-empty')&&!next().disabled&&q('.date-today'),'没有记录的日期不可浏览或返回入口缺失');
  assert(!q('.day-map-clock'),'历史日期显示了当前时刻');
  await click(next());assert(selected()===iso(now)&&next().disabled&&document.activeElement===anchor,'回到今天后焦点留在禁用箭头');
  await wait(250);assert(q('.day-map-clock')?.textContent===new Date(fixedNow).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),'当天时间不是纯HH:MM');
  const pointerClick=async el=>{el.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true}));await wait(0);await click(el)};
  await pointerClick(anchor);assert(q('.calendar-popover'),'日期不能打开月历');await pointerClick(anchor);assert(!q('.calendar-popover'),'再次点击日期不能关闭月历');
  await pointerClick(anchor);await closeCalendar();assert(document.activeElement===anchor,'月历未返回日期触发点');
  const icon=q('.calendar-button');await pointerClick(icon);await pointerClick(icon);assert(!q('.calendar-popover'),'再次点击图标不能关闭月历');await pointerClick(icon);await closeCalendar();assert(document.activeElement===icon,'月历未返回图标触发点');
  await click(icon);await click(q(`[aria-label="${y}年${m+1}月${older}日"]`));assert(selected()===iso(new Date(y,m,older)),'月历未选择目标日期');
  await click(previous());await wait(850);assert(selected()===iso(new Date(y,m,oldest))&&q('.event-list h3')?.textContent===`日期 ${oldest} 的记录`,'迟到响应覆盖快速切换');
  failCalendar=true;await click(previous());await wait(250);assert(selected()===iso(new Date(y,m,oldest-1))&&!next().disabled,'日期可用性读取失败破坏了导航');
  for(let i=0;i<oldest-1;i++){flushSync(()=>previous().click());await wait(0)}
  assert(selected()===iso(new Date(y,m,0)),'前一天不能跨月');
  await click(next());assert(selected()===iso(new Date(y,m,1)),'后一天不能跨月');
  await click(q('.date-today'));assert(selected()===iso(now)&&document.activeElement===anchor&&next().disabled,'回到今天或焦点错误');
  assert(q('.date-track').getAnimations({subtree:true}).length===0,'稳定日期仍有滚动缩放动画');
  output.textContent='PASS：逐日/空日、今天边界、稳定DOM、跨月、快速切换/迟到响应、月历跳转/失败、双触发焦点返回、回到今天与纯时间标签。';
 }catch(error){output.textContent='FAIL：'+error.message}finally{q('#run').disabled=false}
};
</script></html>
