<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>loppi 自动分页验收</title><div id="root"></div><aside id="fixture-controls" style="position:fixed;bottom:8px;left:8px;z-index:10000;background:white;padding:8px;font:12px system-ui"><button id="refresh">刷新已读文字</button><button id="fail">下一页模拟失败</button><output id="result">合成数据，无录音或云服务</output></aside>
<script type="module">
import React from 'react';import {createRoot} from 'react-dom/client';import {mockIPC} from '@tauri-apps/api/mocks';import {DetailDrawer} from '/src/DetailDrawer.tsx';import '/src/App.css';
const from=new Date(2026,9,31,9).getTime();let version=0,fail=false,calls=[];
const row=(prefix,i,width)=>({id:`${prefix}-${i}`,source:'microphone',started_ms:from+i*width,ended_ms:from+(i+1)*width,text:`${prefix} 第 ${i+1} 句 · 这是核对连续滚动的合成文字。`});
const coarse=Array.from({length:120},(_,i)=>row('coarse',i,20000));const precise=Array.from({length:465},(_,i)=>({...row('precise',i,5000),revision:0}));
const base={id:'fixture',title:'465句自动分页验收',started_ms:from,ended_ms:from+2400000,sources:'microphone',processing_state:'partial_transcript',coarse_segments:[],precise_segments:[]};window.isTauri=true;
const status=()=>{const toolbar=document.getElementById('fixture-controls'),dialog=document.querySelector('dialog');if(dialog&&toolbar.parentElement!==dialog)dialog.append(toolbar);const output=document.getElementById('result'),text=`请求 ${calls.length} · 已显示 ${document.querySelectorAll('.transcript-row').length} 行 · 最后偏移 ${calls.at(-1)??0}`;if(output.textContent!==text)output.textContent=text;};
mockIPC(async(command,{request:r})=>{if(r.type==='event_detail'){calls.push(r.offset);if(fail&&r.offset>0){fail=false;throw Error('合成分页失败')}return {type:'event',event:{...base,coarse_segments:coarse.slice(r.offset,r.offset+r.limit),precise_segments:precise.slice(r.offset,r.offset+r.limit).map(p=>({...p,text:p.text+(version?' · 已刷新':'' )}))}}}if(r.type==='session_speakers')return {type:'session_speakers',speakers:[]};if(r.type==='moments')return {type:'moments',moments:[]};throw Error('unexpected '+r.type)});
const root=createRoot(document.getElementById('root'));function render(){root.render(React.createElement(DetailDrawer,{item:base,people:[],refreshToken:version,onClose:()=>root.render(null),onEdit(){},onTools(){},onQueue(){},onDataAction(){},onChanged(){},onMessage(){}}))}render();document.getElementById('refresh').onclick=()=>{version++;render()};document.getElementById('fail').onclick=()=>{fail=true};new MutationObserver(status).observe(document.getElementById('root'),{childList:true,subtree:true});
</script></html>
