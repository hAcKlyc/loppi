<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>loppi 详情定位回归</title>
<div id="root" style="padding:24px"></div><aside style="position:fixed;z-index:999;bottom:8px;left:8px;background:white;padding:8px"><button id="run">运行定位回归</button> <output id="result">模拟长记录，不连接真实数据</output></aside>
<script type="module">
import "/scripts/fixture-controls.ts";
import React from 'react'; import {createRoot} from 'react-dom/client'; import {flushSync} from 'react-dom';
import {TimelineView} from '/src/TimelineView.tsx'; import {DetailDrawer} from '/src/DetailDrawer.tsx'; import '/src/App.css';
const from=new Date(2026,9,17).getTime(),to=new Date(2026,9,18).getTime(),target=from+(17*60+54)*60000;
const base={id:'fixture',manual_range_id:null,title:'模拟长记录',summary:null,started_ms:from,ended_ms:to,sources:'both',processing_state:'unorganized',recording_sources:[],coarse_segments:[],precise_segments:[]};
const rows=Array.from({length:300},(_,i)=>({id:`row-${i}`,source:i%2?'system':'microphone',started_ms:from+i*4*60000,ended_ms:from+(i*4+2)*60000,text:`第 ${i+1} 条模拟转录。这是用于检查长记录定位的文本内容。`}));
let selected=null,version=0,requests=[],hold=null;
if(!window.isTauri)window.isTauri=true;
window.__TAURI_INTERNALS__={invoke:async(command,{request})=>{
 requests.push(request.type+':'+(request.offset??0));
 if(request.type==='event_detail') {if(hold) await hold;return {type:'event',id:'reply',event:{...base,coarse_segments:rows.slice(request.offset,request.offset+request.limit)}};}
 if(request.type==='playback_chunk')return new Promise(()=>{}); // Hold audio to inspect playing state without making sound.
 if(request.type==='moments')return {type:'moments',moments:[]};
 if(request.type==='session_speakers')return {type:'session_speakers',speakers:[]};
 throw Error('Unexpected request '+request.type);
}};
const root=createRoot(document.getElementById('root'));
function render(){flushSync(()=>root.render(React.createElement(React.Fragment,null,
 React.createElement(TimelineView,{date:new Date(from),recordedDays:[from],recordingState:null,captureStatus:null,items:[base],gaps:[],moments:[],loading:false,hideCoarse:false,onDate:()=>{},onCreate:()=>{},onSelect:(item,initialAt)=>{selected={item,initialAt};render()}}),
 selected&&React.createElement(DetailDrawer,{key:'detail',...selected,people:[],refreshToken:version,onClose:()=>{selected=null;render()},onEdit:()=>{},onTools:()=>{},onQueue:()=>{},onDataAction:()=>{},onChanged:()=>{},onMessage:()=>{}})
)));}
render();
const assert=(value,message)=>{if(!value)throw Error(message)};
const frames=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
async function until(check){for(let i=0;i<200;i++){if(check())return;await new Promise(r=>setTimeout(r,10));}throw Error('等待结果超时');}
function openAt(){const track=document.querySelector('.day-map-track'),box=track.getBoundingClientRect();track.querySelector('button').dispatchEvent(new PointerEvent('click',{bubbles:true,detail:1,clientX:Math.ceil(box.left+box.width*(17*60+54)/1440),clientY:box.top+4}));}
function close(){document.querySelector('.detail-header [aria-label="关闭详情"]').click();}
document.getElementById('run').onclick=async()=>{const output=document.getElementById('result');output.textContent='检查中…';try{
 openAt();await until(()=>document.querySelectorAll('.transcript-row').length===270);await frames();
 const enteredAt=Number(document.querySelector('.player-track').value);assert(enteredAt>=target&&enteredAt<target+86400000/document.querySelector('.day-map-track').getBoundingClientRect().width+1,'播放器未停在点击分钟');
 assert(document.querySelector('[aria-label="播放录音"]'),'打开时自动播放');
 assert(requests.includes('event_detail:240'),'目标在后页但未加载');
 const list=document.querySelector('.transcript-list'),row=list.querySelectorAll('.transcript-row')[268],box=list.getBoundingClientRect(),r=row.getBoundingClientRect();
 assert(r.top>=box.top-1&&r.top<box.bottom,'最近文本未滚动可见');
 assert(enteredAt>rows[268].ended_ms&&enteredAt<rows[269].started_ms,'夹具没有覆盖句间空隙');
 assert(row.classList.contains('is-current')&&row.getAttribute('aria-current')==='true','暂停时的最近文本没有选中态');
 list.scrollTop=30;version++;render();await frames();await frames();assert(list.scrollTop===30,'刷新抢走阅读位置');assert(Number(document.querySelector('.player-track').value)===enteredAt,'刷新重置播放器');
 close();await frames();document.querySelector('.day-map-event').click();await until(()=>document.querySelectorAll('.transcript-row').length===30);assert(Number(document.querySelector('.player-track').value)===from,'键盘打开误用旧指针时间');
 close();await frames();document.querySelector('.event-card').click();await until(()=>document.querySelectorAll('.transcript-row').length===30);assert(Number(document.querySelector('.player-track').value)===from,'卡片打开误用时间轴位置');
 close();await frames();let release;hold=new Promise(r=>release=r);openAt();await frames();const count=requests.length;close();hold=null;release();await frames();await frames();assert(!document.querySelector('.detail-drawer'),'关闭后迟到结果重新打开');assert(requests.length===count,'关闭后仍继续翻页');
 assert(!requests.some(r=>r.startsWith('playback_chunk')),'无播放意图却读取音频');
 openAt();await until(()=>document.querySelectorAll('.transcript-row').length===270);await frames();
 const positioned=document.querySelector('.transcript-row.is-current');assert(positioned?.textContent.includes('第 269 条'),'重开后缺少定位高亮');
 document.querySelector('[aria-label="播放录音"]').click();await frames();assert(document.querySelector('[aria-label="暂停播放"]'),'播放状态未切换');assert(!document.querySelector('.transcript-row.is-current'),'播放间隙保留了伪当前句高亮');
 document.querySelector('[aria-label="暂停播放"]').click();await frames();assert(document.querySelector('.transcript-row.is-current')?.textContent.includes('第 269 条'),'暂停后未恢复最近文本选中态');
 const source=document.querySelector('.audio-player select');source.value='system';source.dispatchEvent(new Event('change',{bubbles:true}));await frames();assert(document.querySelector('.transcript-row.is-current')?.textContent.includes('第 270 条'),'来源切换后选中错误文本');
 source.value='both';source.dispatchEvent(new Event('change',{bubbles:true}));await frames();
 output.textContent='PASS：句间选中态、播放/暂停切换、来源筛选、17:54 播放器定位、后页文本滚动、暂停打开、刷新不抢位置、键盘/卡片默认起点、关闭淘汰请求。';
}catch(e){output.textContent='FAIL：'+e.message;}};
</script></html>
