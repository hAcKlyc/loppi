<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>hear 空结果回听回归</title>
<div id="root"></div><aside style="position:fixed;z-index:999;bottom:8px;left:8px;background:white;padding:8px"><button id="run">运行空结果回归</button> <output id="result">模拟数据，不连接真实录音</output></aside>
<script type="module">
import "/scripts/fixture-controls.ts";
import React from 'react'; import {createRoot} from 'react-dom/client';
import {DetailDrawer} from '/src/DetailDrawer.tsx'; import '/src/App.css';
const allEmpty=new URLSearchParams(location.search).has('all-empty');
const start=new Date(2026,9,22,19).getTime();
const item={id:'fixture',manual_range_id:null,title:'模拟讨论',summary:'测试空结果和回听来源。',started_ms:start,ended_ms:start+300000,sources:'both',revision:1,fit_state:'complete',processing_state:allEmpty?'no_transcript':'partial_transcript',manual_asr_state:null,recording_sources:[],coarse_segments:[],precise_segments:[],transcription:{total:allEmpty?1:3,complete:allEmpty?1:3,empty:1,boundary_clipped:false,empty_ranges:[{source:'system',started_ms:start+120000,ended_ms:start+125000}]}};
let requests=[];
window.isTauri=true;
window.__TAURI_INTERNALS__={invoke:async(command,{request})=>{
 requests.push(request);
 if(request.type==='event_detail')return {type:'event',id:'reply',event:item};
 if(request.type==='moments')return {type:'moments',moments:[]};
 if(request.type==='session_speakers')return {type:'session_speakers',speakers:[]};
 if(request.type==='playback_chunk')return new Promise(()=>{});
 throw Error('Unexpected request '+request.type);
}};
createRoot(document.getElementById('root')).render(React.createElement(DetailDrawer,{item,people:[],refreshToken:0,onClose:()=>{},onEdit:()=>{},onTools:()=>{},onQueue:()=>{},onDataAction:()=>{},onChanged:()=>{},onMessage:()=>{}}));
const assert=(v,m)=>{if(!v)throw Error(m)};
const frames=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
document.getElementById('run').onclick=async()=>{const out=document.getElementById('result');try{
 document.querySelectorAll('[role="tab"]')[1].click();await frames();
 assert(document.querySelector('.information-panel').textContent.includes('精转完成 · 1 段无文字'),'完成状态不清楚');
 const button=document.querySelector('.empty-transcription-ranges button');
 assert(button.textContent.includes('电脑声音'),'来源不清楚');
 assert(button.textContent.includes('19:02'),'没有显示范围');
 assert(!requests.some(r=>r.type==='playback_chunk'),'自动读取了音频');
 button.click();await frames();
 assert(Number(document.querySelector('.player-track').value)===start+120000,'未跳到空结果位置');
 assert(document.querySelector('[aria-label="播放来源"]').value==='system','回听来源未同步');
 const playback=requests.find(r=>r.type==='playback_chunk');
 assert(playback?.sources==='system','回听使用了错误来源');
 assert(document.querySelector('[aria-label="暂停播放"]'),'没有开始播放');
 out.textContent='PASS：完成文案、空结果数量、时间范围、用户点击后定位并按正确来源回听。';
}catch(e){out.textContent='FAIL：'+e.message;}};
</script></html>
