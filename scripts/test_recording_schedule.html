<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>hear 定时录制交互验证</title>
<div id="root"></div><aside style="position:fixed;bottom:8px;left:8px;background:white;padding:12px;z-index:100"><button id="run">运行交互回归</button><output id="result">隔离模拟数据，不操作真实录制</output></aside>
<script type="module">
import React,{useState} from 'react';import{createRoot}from'react-dom/client';import{mockIPC}from'@tauri-apps/api/mocks';import{RecordingScheduleSettings}from'/src/RecordingScheduleSettings.tsx';import'/src/App.css';
const h=React.createElement,wait=ms=>new Promise(r=>setTimeout(r,ms));
let state={revision:1,recording_schedule:{enabled:false,start_minute:480,stop_minute:1380,paused_by_schedule:false,next_at_ms:null,next_action:null,error:null}},calls=[],mode='ok',refreshFail=false,setPublished;
const receipts=new Map();
mockIPC(async(command,args)=>{if(command!=='core_request')throw Error(command);calls.push(structuredClone(args));const r=args.request;
 if(receipts.has(args.requestId))return receipts.get(args.requestId);
 if(mode==='conflict'){state={...state,revision:state.revision+1};return{type:'error',code:'revision_conflict',message:'stale'};}
 if(mode==='fail')return{type:'error',code:'database_error',message:'save failed'};
 state={...state,revision:state.revision+1,recording_schedule:{...state.recording_schedule,enabled:r.enabled,start_minute:r.start_minute,stop_minute:r.stop_minute,next_at_ms:Date.now()+3600000,next_action:'stop'}};
 const result={type:'status',state};receipts.set(args.requestId,result);if(mode==='lost')throw Error('reply lost');return result;
});
function App(){const[s,ss]=useState(state);setPublished=ss;return h('main',{style:{maxWidth:700,margin:'50px auto'}},h('h1',null,'设置 · 记录'),h(RecordingScheduleSettings,{state:s,refresh:async()=>{if(refreshFail)throw Error('offline');ss(structuredClone(state));}}));}
createRoot(document.getElementById('root')).render(h(App));
const button=t=>[...document.querySelectorAll('main button')].find(b=>b.textContent.trim()===t);
const click=async e=>{if(!e||e.disabled)throw Error('按钮不可用');e.click();await wait(60)};
const input=async(index,value)=>{const el=document.querySelectorAll('input[type=time]')[index];Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set.call(el,value);el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));await wait(30)};
window.runRegression=async()=>{let n=0;const out=document.getElementById('result'),check=(ok,message)=>{if(!ok)throw Error(message);n++};try{
 await wait(100);setPublished(null);await wait(30);check(document.querySelector('[aria-busy=true]')&&!document.querySelector('[role=switch]')&&!document.querySelector('main').textContent.includes('未启用'),'首次加载不得假装未启用');setPublished(state);await wait(30);check(!state.recording_schedule.enabled&&!button('保存'),'默认关闭且没有未保存草稿');
 await click(document.querySelector('[role=switch]'));check(calls.length===1&&state.recording_schedule.enabled,'开关立即提交并生效');check(!button('保存')&&!document.querySelector('input'),'主页面没有草稿输入和保存');
 await click(button('编辑时间'));await input(1,'08:00');await click(button('保存时间'));check(calls.length===1&&document.querySelector('[role=alert]'),'相同时刻不提交');
 await click(button('取消'));check(!document.querySelector('dialog')&&state.recording_schedule.stop_minute===1380,'取消不写入');
 await click(button('编辑时间'));await input(1,'22:30');mode='fail';await click(button('保存时间'));check(document.querySelectorAll('input[type=time]')[1].value==='22:30'&&button('保存时间'),'失败保留草稿');check(state.recording_schedule.stop_minute===1380,'失败保持事实');
 mode='conflict';await click(button('保存时间'));check(button('保存时间')&&document.querySelector('[role=alert]'),'冲突保留输入并显示错误');const revision=state.revision;
 mode='ok';await click(button('保存时间'));check(calls.at(-1).request.expected_revision===revision,'显式重试使用刷新修订');check(state.recording_schedule.enabled&&!document.querySelector('dialog'),'保存成功关闭编辑');
 await click(button('编辑时间'));await input(0,'09:15');mode='lost';await click(button('保存时间'));const lost=calls.at(-1);check(button('确认上次结果')&&document.querySelector('input[type=time]').disabled&&button('取消').disabled,'结果不明禁止改写');
 await click(button('确认上次结果'));check(JSON.stringify(calls.at(-1))===JSON.stringify(lost),'确认沿用同一请求与ID');check(!document.querySelector('dialog'),'回执确认成功');
 mode='ok';await click(document.querySelector('[role=switch]'));check(!state.recording_schedule.enabled&&state.recording_schedule.start_minute===555,'停用立即生效并保留时间');
 await click(button('编辑时间'));await input(0,'10:15');await click(button('保存时间'));check(!state.recording_schedule.enabled&&state.recording_schedule.start_minute===615,'关闭时修改时间不会启用');
 mode='fail';await click(document.querySelector('[role=switch]'));check(document.querySelector('[role=switch]').getAttribute('aria-checked')==='false','失败开关不显示未提交值');
 mode='lost';await click(document.querySelector('[role=switch]'));const toggleLost=calls.at(-1);check(document.querySelector('[role=switch]').disabled&&button('确认上次结果'),'未知开关结果显示确认');await click(button('确认上次结果'));check(calls.at(-1).requestId===toggleLost.requestId&&document.querySelector('[role=switch]').getAttribute('aria-checked')==='true','同请求确认开关');
 const opener=button('编辑时间');opener.focus();await click(opener);document.querySelector('input').dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));await wait(40);check(!document.querySelector('dialog')&&document.activeElement===opener,'Escape 关闭并恢复发起按钮焦点');mode='ok';await click(opener);await click(button('保存时间'));check(!document.querySelector('dialog')&&document.activeElement===opener,'保存成功解锁按钮后恢复焦点');
 out.textContent=`PASS · ${n} 项交互检查`;return n;
 }catch(e){out.textContent='FAIL · '+e.message;throw e}};
document.getElementById('run').onclick=()=>void window.runRegression();
</script></html>
