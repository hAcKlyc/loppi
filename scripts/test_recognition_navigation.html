<!-- Synthetic App fixture: no credentials, recordings, provider validation or paid requests. -->
<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能识别与配置直达验证</title>
<div id="root"></div><aside style="position:fixed;bottom:8px;right:8px;background:white;padding:10px;border-radius:8px;z-index:10000;font:12px system-ui"><button id="run">运行识别导航回归</button><button id="run-tasks">运行任务明细回归</button><output id="result">合成数据 · 不操作真实录音或云端</output></aside>
<script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import {mockIPC} from '@tauri-apps/api/mocks';
import App from '/src/App.tsx';
const h=React.createElement, wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const scenario=new URLSearchParams(location.search).get('scenario')??'mixed';
const queue=(provider)=>({provider,configured:scenario!=='unconfigured',paused:scenario==='paused'||(scenario==='mixed'&&provider==='asr'),blocked_reason:scenario==='balance'?'provider_http_402':scenario==='blocked'?'future_block':null,pending:provider==='llm'?72:8,processing:provider==='llm'?2:0,failed:provider==='llm'?3:1});
let queues=['llm','asr'].map(queue);
const requests=[];
const base=new Date(2026,10,1,10).getTime();
const review={id:'synthetic-review',kind:'text',original_segment_id:'old-synthetic-segment',source:'microphone',started_ms:base,ended_ms:base+12000,text:'合成记录的文字修正',person_id:null,person_name:null,revision:1};
const usageSeries=(count)=>({requests:count,count,input_tokens:count*1200,output_tokens:count*160,cached_tokens:count*800,cost_nano:count*120000,incomplete:0});
const state={revision:1,enabled_intent:true,paused_intent:true,microphone_enabled:true,system_enabled:true,microphone_phase:'idle',system_phase:'idle',microphone_recording:false,system_recording:false,storage_paused:false,audio_limit_bytes:10*1073741824,audio_used_bytes:1073741824,disk_free_bytes:20*1073741824,recording_schedule:{enabled:false,start_minute:480,stop_minute:1380,paused_by_schedule:false,next_at_ms:null,next_action:null,error:null}};
window.isTauri=true;
mockIPC((command,args)=>{
 if(command==='onboarding_status')return{completed:true};
 if(command==='entry_snapshot')return{sequence:1,state,error:null,mode:'top',appearance:'sleeping',control:'resume',detail:null,notice:null};
 if(command==='privacy_status')return{microphone:3,microphone_available:true,screen_and_system_audio:1,tap_required:false,tap_ready:true};
 if(command==='login_item_status')return 1;
 if(command!=='core_request')return null;
 const r=args.request;requests.push(structuredClone(r));
 if(r.type==='cloud_status')return{type:r.type,queues};
 if(r.type==='calendar_days')return{type:r.type,days:[]};
 if(r.type==='calendar_adjacent')return{type:r.type,newer_ms:null,older_ms:null};
 if(r.type==='moments')return{type:r.type,moments:[]};
 if(r.type==='people')return{type:r.type,people:[]};
 if(r.type==='models')return{type:r.type,state:{phase:'ready',speaker_phase:'ready',progress_percent:100,error:null,speaker_error:null}};
 if(r.type==='timeline')return{type:r.type,items:[],gaps:[]};
 if(r.type==='cloud_tasks')return{type:r.type,tasks:[{id:r.provider+'-failed',provider:r.provider,target_kind:'event',target_id:'synthetic-event',source:'microphone',started_ms:base,ended_ms:base+12000,state:'failed',manual:false,error_code:r.provider==='llm'?'provider_transport':'provider_invalid_utterance'},{id:r.provider+'-pending',provider:r.provider,target_kind:'event',target_id:'synthetic-event-2',source:'system',started_ms:base+3600000,ended_ms:base+3612000,state:'pending',manual:false,error_code:null}]};
 if(r.type==='review_items')return{type:r.type,items:[review]};
 if(r.type==='range_detail')return{type:'event',event:{precise_segments:[{id:'current-synthetic-segment',source:'microphone',started_ms:base,ended_ms:base+12000,text:'合成候选句段'}],coarse_segments:[]}};
 if(r.type==='usage_statistics')return{type:r.type,statistics:{started_ms:r.boundaries[0],currency:'CNY',days:r.boundaries.slice(0,-1).map((started_ms,i)=>({started_ms,covered:true,partial:false,asr:usageSeries((i*7)%9),llm:usageSeries((i*3)%11)}))}};
 if(r.type==='retry_cloud_task'||r.type==='resolve_review')return{type:'ok'};
 if(r.type==='set_cloud_paused'){queues=queues.map(q=>q.provider===r.provider?{...q,paused:r.paused,blocked_reason:null}:q);return{type:'cloud_status',queues};}
 throw Error('Unexpected fixture request: '+r.type);
},{shouldMockEvents:true});
createRoot(document.getElementById('root')).render(h(App));
const button=label=>document.querySelector(`button[aria-label="${label}"]`);
const click=async element=>{if(!element||element.disabled)throw Error('按钮不可用');element.click();await wait(100)};
await wait(140);await click(button('智能识别'));
window.fixtureRequests=requests;
window.runRegression=async()=>{
 let checked=0;
 const check=(ok,message)=>{if(!ok)throw Error(message);checked++};
 const result=document.getElementById('result');
 try{
  const before=requests.length;
  for(const [provider,title]of[['llm','事件分析'],['asr','语音识别'],['llm','事件分析']]){
   await click(button('智能识别'));
   const card=[...document.querySelectorAll('.recognition-card')].find(e=>e.querySelector('h2').textContent===title);
   check(card&&!/运行中|已暂停/.test(card.textContent),'卡片常态由开关呈现');
   const description=card.querySelector('p').textContent;
   await click(button(title+'设置'));
   const row=document.querySelector(`[data-cloud-provider="${provider}"]`),main=document.querySelector('main');
   check(document.activeElement===row,'目标行获得键盘焦点');
   check(document.getElementById(row.getAttribute('aria-labelledby')).textContent===title,'标题一致');
   check(document.getElementById(row.getAttribute('aria-describedby')).textContent===description,'说明一致');
   check(!document.querySelector('dialog[open],input[type=password]'),'直达不会打开密钥');
   const box=row.getBoundingClientRect(),area=main.getBoundingClientRect();
   check(box.top>=area.top&&box.bottom<=area.bottom,'配置行在可见区域');
   check(main.scrollTop>0&&document.scrollingElement.scrollTop===0,'保留主窗口滚动区域');
  }
  check(!requests.slice(before).some(r=>['configure_cloud','cloud_configuration_receipt','set_cloud_paused'].includes(r.type)),'导航无付费或队列写入');
  await click(button('时间线'));await click(button('设置'));
  check(!document.activeElement?.dataset.cloudProvider,'普通设置入口清除定位目标');
  await click(button('智能识别'));
  result.textContent=`PASS · ${checked} 项 · ${scenario}`;
  return{passed:checked,scenario};
 }catch(error){result.textContent='FAIL · '+error.message;throw error}
};
document.getElementById('run').onclick=()=>void window.runRegression();
window.runTaskRegression=async()=>{
 let checked=0;
 const check=(ok,message)=>{if(!ok)throw Error(message);checked++};
 const result=document.getElementById('result');
 try{
  await click(button('智能识别'));
  check(!document.querySelector('[role=tablist]'),'主页面没有统计页签');
  check(document.querySelectorAll('.usage-chart').length===2,'统计图直接展示');
  const main=document.querySelector('main'),statistics=document.querySelector('.usage-statistics');
  const overview=document.querySelector('.recognition-statistics').parentElement;
  const range=[...statistics.querySelectorAll('.usage-range button')].find(b=>b.textContent==='近 7 天');
  await click(range);
  const legend=statistics.querySelector('.usage-legend button');await click(legend);
  const reads=requests.filter(r=>r.type==='usage_statistics').length;
  for(const[provider,title]of[['llm','事件分析'],['asr','语音识别'],['llm','事件分析']]){
   main.scrollTop=main.scrollHeight;check(main.scrollTop>0,'主页面具有实际滚动内容');
   await click(button(title+'任务明细'));
   check(document.querySelector('h1').textContent===title+'任务明细'&&document.activeElement===document.querySelector('h1'),'任务标题及键盘焦点');
   check(main.scrollTop===0,'进入任务页回到页首');
   check(overview.hidden&&overview.hasAttribute('inert'),'隐藏主面板不暴露于键盘及辅助阅读');
   check(document.querySelectorAll('.task-row').length===2&&[...document.querySelectorAll('.task-row strong')].every(row=>row.textContent.includes(title)),'任务按服务过滤');
   check(provider==='asr'?document.querySelectorAll('.review-row').length===1:!document.querySelector('.review-row'),'语音识别保留待核对入口');
   check(!![...document.querySelectorAll('.task-row button')].find(b=>b.textContent===(provider==='asr'?'重新识别':'重试')),'任务恢复操作保留');
   main.scrollTop=main.scrollHeight;
   await click(document.querySelector('.recognition-back'));
   check(document.querySelector('h1').textContent==='智能识别'&&main.scrollTop===0,'返回主页面回到页首');
   check(document.querySelector('.usage-statistics')===statistics&&range.getAttribute('aria-pressed')==='true'&&legend.getAttribute('aria-pressed')==='false','返回保留统计范围与指标');
  }
  check(requests.filter(r=>r.type==='usage_statistics').length===reads,'局部导航不重建统计读取');
  result.textContent=`PASS · ${checked} 项任务明细与统计保留检查`;
  return{passed:checked};
 }catch(error){result.textContent='FAIL · '+error.message;throw error}
};
document.getElementById('run-tasks').onclick=()=>void window.runTaskRegression();
</script></html>
