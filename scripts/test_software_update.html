<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>loppi 软件更新隔离预览</title>
<div id="root"></div>
<script type="module">
import React from 'react';import{createRoot}from'react-dom/client';import{mockIPC}from'@tauri-apps/api/mocks';import{emit}from'@tauri-apps/api/event';import{SettingsView}from'/src/WorkspaceViews.tsx';import{useAppUpdate}from'/src/useAppUpdate.ts';import{RestartUpdate}from'/src/SoftwareUpdate.tsx';import'/src/App.css';
window.isTauri=true;
const h=React.createElement;
let status={revision:0,available:null,phase:'idle',checked:false,error:''};
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function publish(fields){
 status={...status,...fields,revision:status.revision+1};
 await emit('loppi-update-status',status);
}
mockIPC(async(command)=>{
 if(command==='plugin:app|version')return'0.1.27';
 if(command==='update_status')return status;
 if(command==='entry_snapshot')return{mode:'top'};
 if(command==='check_update'){
  await publish({phase:'downloading',error:''});
  await sleep(1200);
  await publish({phase:'idle',checked:true,available:{currentVersion:'0.1.27',version:'0.1.28'}});
  return;
 }
 if(command==='install_update'){
  for(const phase of ['stopping','installing']){await publish({phase});await sleep(800);}
  await publish({phase:'idle',error:'隔离演示已结束，软件未安装。'});
  return;
 }
 throw Error('Unsupported fixture command: '+command);
},{shouldMockEvents:true});
const state={revision:1,enabled_intent:true,paused_intent:false,microphone_enabled:true,system_enabled:true,microphone_phase:'recording',system_phase:'recording',audio_limit_bytes:10*1073741824,audio_used_bytes:1073741824,disk_free_bytes:30*1073741824,recording_schedule:{enabled:false,start_minute:480,stop_minute:1380,next_at_ms:null,next_action:null,error:null}};

createRoot(document.getElementById('root')).render(h(React.StrictMode,null,h(App)));
</script>
