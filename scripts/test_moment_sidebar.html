<!-- Local regression fixture: mocked IPC only; no access to user data or recording. -->
<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>hear 现场记录回归</title>
<div id="root"></div>
<aside style="position:fixed;bottom:8px;left:8px;z-index:101;background:white;padding:10px;max-width:240px;font:12px system-ui"><button id="run">运行现场记录回归</button><output id="result">仅模拟记录</output></aside>
<script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import {mockIPC} from '@tauri-apps/api/mocks';
import {DetailDrawer} from '/src/DetailDrawer.tsx';
import '/src/App.css';
const base=new Date(2026,9,18,19,44).getTime();
const item={id:null,title:'',started_ms:base,ended_ms:base+1200000,sources:'microphone',revision:1,processing_state:'unorganized',coarse_segments:[{id:'coarse',started_ms:base+60000,ended_ms:base+65000,source:'microphone',text:'这是一段用来检查现场记录与回听时间的示例转录。'}],precise_segments:[]};
const make=(id,kind,offset,extra={})=>({id,kind,anchor_ms:base+offset,created_ms:base+offset,captured_ms:null,text:null,ocr_text:null,ocr_state:null,...extra});
let moments=[
 make('comment','comment',187000,{text:'讨论到这里，记得回头整理重点。\n这是一条手动写下的笔记。'}),
 make('mark1','mark',210000),
 make('shot','screenshot',297000,{ocr_state:'complete',ocr_text:'hear\nFile\nEdit\n'+('识别文字保留完整内容，按需展开阅读。\n'.repeat(25))+'最后一行'}),
 make('mark2','mark',1181000),
 make('failed','screenshot',1186000,{ocr_state:'failed'}),
 make('empty','screenshot',1190000,{ocr_state:'complete',ocr_text:'  '}),
];
const requests=[],messages=[];let rejectNote=false,holdImage=null;
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
// The preview only needs a valid image, not actual captured pixels.
const canvas=document.createElement('canvas');canvas.width=800;canvas.height=450;const ctx=canvas.getContext('2d');ctx.fillStyle='#eff5f0';ctx.fillRect(0,0,800,450);ctx.fillStyle='#215d50';ctx.font='32px system-ui';ctx.fillText('截图预览 · 测试画面',40,80);const png=canvas.toDataURL().split(',')[1];
window.isTauri=true;
mockIPC(async(command,args)=>{
 if(command!=='core_request')return null;
 const r=args.request;requests.push(r);
 if(r.type==='range_detail')return {type:'event',event:item};
 if(r.type==='moments')return {type:'moments',moments};
 if(r.type==='screenshot_data'){if(holdImage)await holdImage;return {type:'screenshot_data',png_base64:png};}
 if(r.type==='playback_chunk')return {type:'playback_chunk',has_audio:false,wav_base64:'',next_audio_ms:null};
 if(r.type==='add_moment'){if(rejectNote)throw Error('simulated save failure');moments=[...moments,make('saved','comment',r.anchor_ms-base,{text:r.text})].sort((a,b)=>a.anchor_ms-b.anchor_ms);return {type:'ok'};}
 return {type:'ok'};
});
let token=0;const root=createRoot(document.getElementById('root'));
const render=()=>root.render(React.createElement(DetailDrawer,{item,people:[],onClose:()=>{},onEdit:()=>{},onTools:()=>{},onQueue:()=>{},onDataAction:()=>{},onChanged:()=>{},onMessage:m=>messages.push(m),refreshToken:token}));render();
const assert=(value,message)=>{if(!value)throw Error(message)};
const click=async el=>{assert(el,'缺少目标控件');el.click();await wait(120)};
const input=async value=>{const el=document.querySelector('.note-composer textarea');Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype,'value').set.call(el,value);el.dispatchEvent(new Event('input',{bubbles:true}));await wait(80)};
document.getElementById('run').onclick=async()=>{
 const output=document.getElementById('result');output.textContent='检查中…';document.getElementById('run').disabled=true;
 try{
 await wait(200);
 const rows=[...document.querySelectorAll('.moment-record')];assert(rows.length===6,'记录数量');
 const first=rows[0].getBoundingClientRect();assert(rows.every(r=>Math.abs(r.getBoundingClientRect().left-first.left)<1&&Math.abs(r.getBoundingClientRect().width-first.width)<1),'记录未统一左对齐/宽度');
 assert(rows[1].getBoundingClientRect().height<65,'重点不是紧凑单行');
 const disclosure=document.querySelector('.moment-ocr');assert(!disclosure.open,'识别文字默认展开');
 assert(rows[2].getBoundingClientRect().height<160,'折叠截图高度过大');
 assert(document.querySelector('.moment-text').textContent.includes('\n'),'笔记换行丢失');
 assert(document.querySelector('.moment-status.failed').textContent.includes('图片已保存'),'识别失败误报图片丢失');
 assert([...document.querySelectorAll('.moment-status')].some(e=>e.textContent==='未识别到文字'),'无文字状态不准确');
 assert(!requests.some(r=>r.type==='screenshot_data'),'列表主动读取全部截图');
 await click(disclosure.querySelector('summary'));assert(disclosure.open,'识别文字无法展开');
 const ocr=disclosure.querySelector('.moment-ocr-text');assert(ocr.textContent.endsWith('最后一行')&&ocr.scrollHeight<=ocr.clientHeight+1,'识别文字被截断');
 await click(disclosure.querySelector('summary'));
 const replayBefore=requests.filter(r=>r.type==='playback_chunk').length;
 let release;holdImage=new Promise(r=>release=r);const shots=[...document.querySelectorAll('.screenshot-card')];
 await click(shots[0]);assert(shots[0].textContent.includes('正在打开')&&shots.every(b=>b.disabled),'截图加载反馈');
 release();holdImage=null;await wait(150);
 assert(requests.find(r=>r.type==='screenshot_data').moment_id==='shot','截图 ID 不匹配');
 assert(document.querySelector('.image-preview img'),'原图未打开');
 assert(requests.filter(r=>r.type==='playback_chunk').length===replayBefore,'截图触发回听');
 await click(document.querySelector('.image-preview-close'));
 await click(rows[1].querySelector('.note-time'));
 assert(requests.filter(r=>r.type==='playback_chunk').at(-1).from_ms===base+210000,'回听时间错误');
 assert(document.querySelector('.note-composer-footer').textContent.includes('19:47:30'),'笔记时间未跟随选择');
 await input('保存回归笔记');rejectNote=true;await click(document.querySelector('.note-composer button'));
 assert(document.querySelector('.note-composer textarea').value==='保存回归笔记','失败清空草稿');
 rejectNote=false;await click(document.querySelector('.note-composer button'));
 assert(requests.filter(r=>r.type==='add_moment').at(-1).anchor_ms===base+210000,'保存时刻与提示不一致');
 assert(document.querySelector('.note-composer textarea').value==='','成功未清空草稿');
 // Exercise the supported narrow sidebar width without resizing the user's browser.
 const aside=document.querySelector('.notes-panel'),columns=document.querySelector('.detail-columns');
 const old=columns.style.gridTemplateColumns;columns.style.gridTemplateColumns='minmax(0, 1fr) 240px';await wait(100);
 assert(aside.scrollWidth<=aside.clientWidth+1,'窄栏水平溢出');
 assert([...aside.querySelectorAll('.moment-record,.note-composer')].every(el=>el.scrollWidth<=el.clientWidth+1),'窄栏内容溢出');
 columns.style.gridTemplateColumns=old;
 moments=[];token++;render();await wait(200);assert(document.querySelector('.notes-empty')?.textContent.includes('还没有现场记录'),'空状态');
 const transcript='# 会议安排\n\n| 事项 | 时间 |\n| --- | --- |\n| 设计评审 | 周三 14:00 |\n\n- 确认页面布局\n- [无法辨认]\n\n![外部图片](https://example.invalid/leak)\n[链接文字](https://example.invalid)\n<script>window.bad=true<\/script>';
 let copied='';Object.defineProperty(navigator,'clipboard',{configurable:true,value:{writeText:async text=>{copied=text}}});
 moments=[make('cloud','screenshot',297000,{image_state:'pending',ocr_state:'complete',ocr_text:'本地备用文字'}),make('cloud-failed','screenshot',350000,{image_state:'failed',ocr_text:'仍可阅读的本地结果'}),make('cloud-paused','screenshot',360000,{image_state:'paused',ocr_state:'failed'})];
 token++;render();await wait(200);
 assert(document.querySelector('.notes-stream').textContent.includes('等待图片理解'),'等待反馈缺失');
 assert(document.querySelector('.notes-stream').textContent.includes('可在队列中重试'),'云失败重试提示缺失');
 assert(document.querySelector('.notes-stream').textContent.includes('已暂停'),'暂停反馈缺失');
 moments[0]={...moments[0],image_state:'complete',image_summary:'这是一张会议安排截图，列出了设计评审时间和待确认事项。',image_transcript:transcript};
 await wait(3400);assert(document.querySelector('.image-summary')?.textContent.includes('会议安排'),'后台完成未自动刷新');
 const md=document.querySelector('.moment-record .moment-ocr');assert(!md.open,'完整转录默认未折叠');
 await click(md.querySelector('summary'));
 assert(md.querySelector('h1')?.textContent==='会议安排'&&md.querySelector('table')&&md.querySelectorAll('li').length===2,'Markdown 结构丢失');
 assert(!md.querySelector('img')&&!md.querySelector('a')&&!md.querySelector('script'),'转录触发活动内容');
 await click(md.querySelector('button'));assert(copied===transcript&&md.textContent.includes('已复制'),'Markdown 复制非原文');
 const cols=document.querySelector('.detail-columns');const previous=cols.style.gridTemplateColumns;cols.style.gridTemplateColumns='minmax(0,1fr) 240px';await wait(100);
 assert(document.querySelector('.notes-panel').scrollWidth<=document.querySelector('.notes-panel').clientWidth+1,'Markdown 窄栏溢出');cols.style.gridTemplateColumns=previous;
 moments=[moments[0],make('no-text','screenshot',400000,{image_state:'complete',image_summary:'一张山景照片。',image_transcript:''})];token++;render();await wait(200);
 assert(document.querySelector('.notes-stream').textContent.includes('图片中没有可转录的文字'),'无文字图片状态错误');
 output.textContent='PASS：对齐/紧凑重点/OCR折叠与完整阅读/原图与回听隔离/加载反馈/笔记锚点与失败保稿/窄栏/空状态/图片摘要与Markdown/复制/安全呈现/后台刷新/云状态';
 }catch(error){output.textContent=`FAIL：${error.message}`;throw error;}finally{document.getElementById('run').disabled=false;}
};
</script></html>
