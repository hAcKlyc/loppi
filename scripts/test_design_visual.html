<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loppi 视觉场景验收</title>
<style>@import "/src/tokens.css";body{margin:0;background:var(--color-canvas);font:14px/1.6 system-ui;color:var(--color-text)}header{padding:16px}button,select{font:inherit;padding:6px}iframe{border:0;display:block;transform-origin:top left}#frame{overflow:hidden}pre{white-space:pre-wrap;font-size:12px}</style>
<header><button id="run">运行视觉场景检查</button> <label>窗口 <select id="size"><option>1120</option><option>760</option><option>1440</option></select></label> <label>场景 <select id="scene"><option value="timeline">时间线</option><option value="detail">长转录详情</option><option value="crossday">跨日详情</option><option value="recording">正在记录</option><option value="empty">空记录</option><option value="error">读取失败</option></select></label> <label>时刻 <select id="clock"><option>18:30</option><option>00:00</option><option>01:17</option><option>12:00</option><option>23:59</option></select></label> <button id="run-clocks">检查时刻几何</button><pre id="clock-result"></pre><pre id="result">真实组件，隔离数据；减少动态效果使用样例内偏好模拟，不修改系统设置。</pre></header><div id="frame"><iframe id="preview" title="视觉场景"></iframe></div>
<script>
const frame=document.getElementById('preview'),size=document.getElementById('size'),scene=document.getElementById('scene'),clock=document.getElementById('clock'),clockResult=document.getElementById('clock-result'),result=document.getElementById('result'),wait=ms=>new Promise(r=>setTimeout(r,ms));
function fit(){const width=Number(size.value),height=width===760?540:width===1440?900:760,scale=Math.min(1,innerWidth/width);frame.width=width;frame.height=height;frame.style.transform=`scale(${scale})`;frame.parentElement.style.height=`${height*scale}px`;}
async function load(reduced=false){await new Promise(resolve=>{frame.onload=resolve;frame.src=`/scripts/test_design_scene.html?scene=${scene.value}&clock=${clock.value}${reduced?'&reduce=1':''}`;});await wait(800);}
size.onchange=fit;scene.onchange=()=>load();clock.onchange=()=>load();new ResizeObserver(fit).observe(document.body);
document.getElementById('run').onclick=async()=>{const runner=document.getElementById('run');runner.disabled=true;const lines=[];try{for(const width of [760,1120,1440]){size.value=String(width);fit();for(const kind of ['timeline','detail','crossday','recording','empty','error']){scene.value=kind;await load();const doc=frame.contentDocument,win=frame.contentWindow;const check=(ok,message)=>{if(!ok)throw Error(`${width}/${kind}: ${message}`)};const inside=el=>{if(!el)return false;const r=el.getBoundingClientRect();return r.left>=0&&r.right<=win.innerWidth+1&&r.top>=0&&r.bottom<=win.innerHeight+1;};
 check(win.innerWidth===width,'窗口不符');check(doc.querySelector('.main-area').scrollWidth<=doc.querySelector('.main-area').clientWidth+1,'主区域溢出');
 if(kind==='detail'||kind==='crossday') {check(inside(doc.querySelector('[aria-label=关闭详情]'))&&inside(doc.querySelector('.note-composer')),'详情操作被裁切');check(doc.querySelectorAll('.transcript-row').length>=10,'长文本数据不足');check([...doc.querySelectorAll('.transcript-content')].every(el=>el.scrollWidth<=el.clientWidth+1),'转录内容溢出');const text=doc.querySelector('.transcript-content p'),style=win.getComputedStyle(text);check(style.fontSize==='15px'&&style.lineHeight==='26.25px','阅读字号/行距未采用');check(doc.querySelector('.detail-scroll').scrollHeight>doc.querySelector('.detail-scroll').clientHeight,'未覆盖真实滚动长文');const reading=doc.querySelector('.detail-scroll'),notes=doc.querySelector('.notes-stream');reading.scrollTop=reading.scrollHeight;notes.scrollTop=notes.scrollHeight;await wait(30);check(Math.abs(reading.scrollTop+reading.clientHeight-reading.scrollHeight)<=1&&Math.abs(notes.scrollTop+notes.clientHeight-notes.scrollHeight)<=1,'长内容无法滚动到底');check(inside(doc.querySelector('.note-composer')),'滚动后丢失输入区');}
 else if(kind==='recording'){check(doc.querySelector('.event-card.is-recording')?.textContent.includes('正在记录'),'真实录音状态未体现');check(win.getComputedStyle(doc.querySelector('.event-card.is-recording'),'::before').animationName==='none','仍有持续扫光');}
 else if(kind==='empty')check(!!doc.querySelector('.list-empty'),'缺少空状态');
 else if(kind==='error')check(doc.body.textContent.includes('失败')&&!!doc.querySelector('.detail-load-error button'),'缺少失败重试');
 else check(inside(doc.querySelector('.create-event'))&&inside(doc.querySelector('.event-card')),'时间线主要入口不在视口');
 lines.push(`${width} × ${win.innerHeight} / ${kind}: PASS`);result.textContent=lines.join('\n');}}
 size.value='1120';scene.value='recording';fit();await load(true);const doc=frame.contentDocument,win=frame.contentWindow;
 if(!doc.documentElement.hasAttribute('data-reduced-fixture')||win.getComputedStyle(doc.querySelector('.date-choice')).transitionDuration!=='0s'||win.getComputedStyle(doc.querySelector('.event-card')).transitionDuration!=='0s')throw Error('减少动态效果分支未生效');
 result.textContent=lines.join('\n')+'\nreduced-motion: PASS · CSS 和 React 偏好模拟\n全部通过';
 }catch(e){result.textContent=lines.join('\n')+'\nFAIL · '+e.message;}finally{runner.disabled=false;}};
document.getElementById('run-clocks').onclick=async()=>{const button=document.getElementById('run-clocks');button.disabled=true;const evidence=[];try{
 for(const width of [1120,760]){size.value=String(width);fit();scene.value='empty';for(const value of ['00:00','01:17','12:00','23:59']){clock.value=value;await load();const doc=frame.contentDocument,win=frame.contentWindow;
 const rect=selector=>{const r=doc.querySelector(selector).getBoundingClientRect();return Object.fromEntries(['left','right','top','bottom','width'].map(key=>[key,r[key]]))};
 const e={width:win.innerWidth,height:win.innerHeight,clock:value,axis:rect('.day-map-now-track'),first:rect('.day-map-track'),heading:rect('.day-map-heading'),label:rect('.day-map-clock'),line:rect('.day-map-now'),text:doc.querySelector('.day-map-clock').textContent};
 const check=(ok,message)=>{if(!ok)throw Error(`${width}/${value}: ${message}`)};
 check(win.innerWidth===width,'真实窗口尺寸不符');check(e.text===value,'非纯时间');check(e.label.left>=e.axis.left-1&&e.label.right<=e.axis.right+1,'标签横向溢出');check(e.label.bottom<e.line.top&&e.label.top>=e.heading.bottom,'标签未在独立通道');check(Math.abs(e.line.top-e.first.top)<0.6,'红线未对齐首轨');
 if(!['00:00','23:59'].includes(value))check(Math.abs((e.label.left+e.label.right)/2-e.line.left)<0.6,'中间时刻未对准红线');
 evidence.push(e);
 }}clockResult.textContent=JSON.stringify(evidence,null,2);result.textContent='时刻几何全部通过';
 }catch(error){result.textContent='FAIL · '+error.message;}finally{button.disabled=false;}};
fit();load();
</script></html>
