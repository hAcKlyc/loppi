<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body><div id="root"></div><script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import {mockIPC} from '@tauri-apps/api/mocks';
import {OnboardingView} from '../src/OnboardingView.tsx';
import {ModelPreparation,SourcePreparation} from '../src/SetupGroups.tsx';
import {CloudKeyInput} from '../src/CloudKeyInput.tsx';
import '../src/App.css';
const flags=new URLSearchParams(location.search), ready=flags.has('ready');
window.isTauri=true;
const state={disk_free_bytes:flags.has('disk')?0:3_000_000_000,audio_used_bytes:0,audio_limit_bytes:1000,revision:0,enabled_intent:false,paused_intent:false,microphone_enabled:true,system_enabled:true,microphone_phase:'idle',system_phase:'idle'};
const privacy={microphone:flags.has('denied')?2:ready?3:0,microphone_available:true,tap_required:true,tap_ready:ready,screen_and_system_audio:0};
const models={phase:ready?'ready':'missing',speaker_phase:flags.has('speaker')?'failed':ready?'ready':'missing',progress_percent:0,error:null,speaker_error:flags.has('speaker')?'model_network':null};
const queues=[{provider:'llm',configured:ready},{provider:'asr',configured:ready}];
const calls=[];window.calls=calls;
mockIPC((command,args)=>{
 // Deliberately omit entered test keys from the visible call log.
 calls.push({command,type:args?.request?.type,source:args?.source??args?.request?.source,provider:args?.request?.provider});
 if(command==='complete_onboarding')return {completed:true};
 if(command==='request_microphone_permission')privacy.microphone=3;
 if(command==='request_system_audio_permission')privacy.tap_ready=true;
 if(command==='core_request'){
  const r=args.request;
  if(r.type==='set_source'){
   if(flags.has('pending'))return new Promise(()=>{});
   state[r.source+'_enabled']=r.enabled;state.revision++;
  }
  if(r.type==='configure_cloud'){
   if(flags.has('cloudpending'))return new Promise(()=>{});
   if(flags.has('cloudfail')&&r.provider==='asr')return {type:'error',code:'cloud_validation',message:'测试凭据无效'};
   queues.find(q=>q.provider===r.provider).configured=true;
  }
  if(r.type==='prepare_models')models.phase=models.speaker_phase='ready';
  return {type:'cloud_status',id:'test'};
 }
 return 1;
});
function Harness(){
 const [,refresh]=React.useReducer(x=>x+1,0);const [done,setDone]=React.useState(false);
 const onRefresh=async()=>refresh();
 if(done)return React.createElement('div',null,React.createElement('h1',null,'时间线 · 未开始录音'),React.createElement('output',null,JSON.stringify(calls)));
 if(flags.has('settings'))return React.createElement('div',{className:'settings-page'},React.createElement(ModelPreparation,{models,onRefresh}),React.createElement(SourcePreparation,{state,privacy,onRefresh}),React.createElement(CloudKeyInput,{provider:'llm',configured:queues[0].configured,onRefresh}));
 return React.createElement(OnboardingView,{state,privacy,models,queues,queuesReady:true,errors:{models:'',privacy:'',queues:'',state:''},onRefresh,onComplete:()=>setDone(true),onLater:()=>setDone(true)});
}
if(flags.has('frame')){const frame=document.createElement('iframe');frame.width='760';frame.height='540';flags.delete('frame');frame.src='test_onboarding.html?'+flags.toString();document.body.replaceChildren(frame);}else createRoot(document.getElementById('root')).render(React.createElement(Harness));
if(flags.has('regression')){
 const run=document.createElement('button'),out=document.createElement('output');run.textContent='运行首次引导回归';document.body.append(run,out);
 run.onclick=async()=>{const wait=ms=>new Promise(r=>setTimeout(r,ms));let n=0;const check=(v,m)=>{if(!v)throw Error(m);n++};try{
  const key=document.querySelector('input[aria-label="DeepSeek API Key"]');key.focus();Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set.call(key,'test-only-onboarding');key.dispatchEvent(new Event('input',{bubbles:true}));await wait(30);key.blur();await wait(100);
  check(calls.filter(c=>c.type==='configure_cloud').length===1,'compact 失焦提交一次');check(key.value==='••••••••••••','成功恢复掩码');
  document.querySelector('[aria-label="选择声音来源与授权帮助"]').click();await wait(30);document.querySelector('input[type=checkbox]').click();await wait(100);check(!state.microphone_enabled&&calls.some(c=>c.type==='set_source'),'compact 来源选择继续生效');
  const finish=[...document.querySelectorAll('button')].find(b=>b.textContent.includes('完成设置'));finish.click();await wait(100);check(calls.some(c=>c.command==='complete_onboarding')&&!calls.some(c=>['start','resume'].includes(c.type)),'完成首次设置不开始录音');
  out.textContent=`PASS · ${n} 项首次引导检查`;
 }catch(e){out.textContent='FAIL · '+e.message;}};
}
</script></body></html>
