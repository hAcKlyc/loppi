name: 功能建议
description: 描述使用场景、目标与当前遇到的限制。
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: "说明什么时候需要这项能力，以及当前做法的限制。请勿附私人记录。"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望得到的结果
      description: "描述用户可观察的行为；可以附合成示例。"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的方式与其他考虑
