name: 问题报告
description: 使用合成或公开样本描述可重复的问题。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "安全或隐私漏洞请私密发送至 myagents.io@gmail.com。不要上传 API Key、真实谈话、数据库、声纹或私人桌面截图。"
  - type: input
    id: version
    attributes:
      label: 应用版本与来源
      placeholder: "例如 0.1.18 / 官方 DMG；开发构建请附源码与 dirty 状态"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 系统与架构
      placeholder: "例如 macOS 26 / Apple Silicon，或 Windows 11 Build 26300 / x64"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: "使用合成或公开授权样本，说明相关设置和步骤。"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 脱敏诊断与补充信息
      description: "可附错误码或已检查的诊断摘要。删去正文、路径中的个人信息、账号和凭据。"
  - type: checkboxes
    id: privacy
    attributes:
      label: 内容检查
      options:
        - label: "报告和附件不包含私人录音、转录、数据库、声纹、凭据或个人截图。"
          required: true
