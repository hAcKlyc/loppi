name: Windows 0.1.27 candidate installer
on:
  push:
    branches: [codex/verify-0.1.27-windows]
permissions:
  contents: read
  actions: read
jobs:
  build_and_install:
    runs-on: windows-2025-vs2026
    timeout-minutes: 85
    env:
      CARGO_BUILD_JOBS: '2'
      CMAKE_GENERATOR: Visual Studio 18 2026
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0862177ee2dbc6d0b9dd0b011f31649bc5781736
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-candidate
          run-id: '43619786928'
          github-token: ${{ github.token }}
      - name: Exercise NSIS and installed components on the hosted Windows VM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-Item 'target/x86_64-pc-windows-msvc/release/bundle/nsis/loppi_0.1.27_x64-setup.exe'
          $dest = Join-Path $env:RUNNER_TEMP 'loppi-candidate'
          $env:LOPPI_DATA_DIR = Join-Path $env:RUNNER_TEMP 'loppi-candidate-data'
          $env:LOPPI_TEST_PARENT_PID = [string]$PID
          $startup = @{}
          $cli = $null
          $gui = Join-Path $dest 'loppi-desktop.exe'
          try {
            $result = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$dest" -PassThru -Wait
            if ($result.ExitCode -ne 0) { throw "NSIS install failed: $($result.ExitCode)" }
            $report = Get-Content build/windows/release-info-windows-x64.json -Raw | ConvertFrom-Json
            $core = Join-Path $dest 'loppi-core.exe'
            $gui = Join-Path $dest 'loppi-desktop.exe'
            $worker = Join-Path $dest 'loppi-worker.exe'
            $cli = Join-Path $dest 'loppi.exe'
            foreach ($f in @($core,$gui,$worker,$cli)) {
              if (-not (Test-Path -LiteralPath $f)) { throw "Missing installed binary $f" }
            }
            $runtime = & $worker --runtime-info | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $runtime.sherpa_onnx -notmatch '^v?2\.0\.1$') { throw "Unexpected inference runtime $runtime" }
            $models = Join-Path $dest 'resources/models'
            $env:LOPPI_MODEL_ROOT = $models
            $env:LOPPI_CORE_BIN = $core
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              $state = (& $cli models status | ConvertFrom-Json).state
              if ($LASTEXITCODE -ne 0 -or $state.phase -eq 'failed') { throw 'Installed Core model query failed' }
              if ($state.phase -eq 'ready' -and $state.speaker_phase -eq 'ready') { $ready = $true; break }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Windows installed models did not become ready' }
            $status = (& $cli status | ConvertFrom-Json).state
            if ($LASTEXITCODE -ne 0 -or $status.enabled_intent) { throw 'Installed Core did not start isolated and idle' }
            $guiVersion = (Get-Item $gui).VersionInfo.ProductVersion
            $startup = @{
              installed = $true; installer_sha256 = (Get-FileHash $installer.FullName).Hash
              source = $report.source; version = $report.version; components = $report.components
              runtime = $runtime; models_ready = $ready; gui_product_version = $guiVersion
            }
          } finally {
            if ($cli -and (Test-Path -LiteralPath $cli)) {
              $shutdown = & $cli prepare-install
              $startup.prepare_install_exit = $LASTEXITCODE
              $startup.prepare_install = "$shutdown"
            }
            $uninstaller = Join-Path $dest 'uninstall.exe'
            if (Test-Path -LiteralPath $uninstaller) {
              $uninstallTimer = [Diagnostics.Stopwatch]::StartNew()
              $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru -Wait
              $startup.uninstaller_exit = $uninstall.ExitCode
              while ((Test-Path -LiteralPath $gui) -and $uninstallTimer.Elapsed.TotalSeconds -lt 20) {
                Start-Sleep -Milliseconds 250
              }
              $startup.app_removed = -not (Test-Path -LiteralPath $gui)
              $startup.data_retained = Test-Path -LiteralPath (Join-Path $env:LOPPI_DATA_DIR 'loppi.sqlite')
              if ($uninstall.ExitCode -ne 0 -or -not $startup.app_removed -or -not $startup.data_retained) {
                $startup | ConvertTo-Json -Depth 8 | Set-Content build/windows/candidate-install.json
                $startup | ConvertTo-Json -Depth 8
                throw 'Unexpected Windows uninstall or data retention result'
              }
            }
            $startup | ConvertTo-Json -Depth 8 | Set-Content build/windows/candidate-install.json
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-install-evidence
          path: build/windows/candidate-install.json
          if-no-files-found: warn
          retention-days: 14
