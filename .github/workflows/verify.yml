name: Verify
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install frontend test dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify the same gate as local development
        run: python3 scripts/verify.py --report build/verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: build/verification.json
