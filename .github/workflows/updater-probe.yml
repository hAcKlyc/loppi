name: Windows updater runtime probe
on:
  push:
    branches: [codex/verify-0.1.28-windows]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - run: npm ci --no-audit --no-fund
      - name: Exercise hidden update checks, retries, wake and sidebar on Windows
        shell: pwsh
        run: |
          New-Item .loppi-updater-probe -ItemType File
          python scripts/probe_updater.py
