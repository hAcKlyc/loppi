[workspace]
members = ["crates/loppi-protocol", "crates/loppi-core", "crates/loppi-cli", "crates/loppi-worker", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.18"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
