[workspace]
members = ["crates/loppi-protocol", "crates/loppi-core", "crates/loppi-cli", "crates/loppi-worker", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.23"
edition = "2024"
license = "Apache-2.0"
authors = ["Ethan L <myagents.io@gmail.com>"]
repository = "https://github.com/hAcKlyc/loppi"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
