[package]
license.workspace = true
authors.workspace = true
repository.workspace = true
name = "loppi-core"
version.workspace = true
edition.workspace = true
build = "build.rs"

[dependencies]
cpal = "0.18.2"
loppi-protocol = { path = "../loppi-protocol" }
serde_json.workspace = true
serde.workspace = true
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
fs2 = "0.4"
libc = "0.2"
uuid = "1"
opus2 = { version = "0.4.0", features = ["bundled"] }
ogg = "0.9.2"
ureq = "2.12.1"
httpdate = "1.0.3"
sha2 = "0.10"
tar = "0.4"
bzip2 = "0.5"
base64 = "0.22"
tempfile = "3"
rtrb = "=0.4.1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
sherpa-onnx = "=2.0.0"

[target.'cfg(windows)'.dependencies]
sherpa-onnx = { version = "=2.0.0", default-features = false, features = ["shared"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Pipes", "Win32_Storage_FileSystem"] }
chrono = "0.4.45"
chrono-tz = "0.10.4"
iana-time-zone = "0.1"

[dev-dependencies]

[build-dependencies]
cc = "1"
