[package]
name = "hear-desktop"
version = "0.1.8"
description = "A private, continuous context recorder for macOS"
edition = "2024"

[lib]
name = "hear_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
hear-protocol = { path = "../crates/hear-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"
